<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lo que está en juego · U02 Marketing Digital</title><style>:root{color-scheme:dark;--bg:#071623;--panel:#10283a;--ink:#eff8ff;--muted:#aac4d6;--accent:#5dd7e8;--gold:#ffca78;--line:#2a465a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,sans-serif}button,textarea,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:4px}main{max-width:1020px;margin:auto;padding:34px 28px 60px}.eyebrow{color:var(--accent);font-size:12px;font-weight:750;letter-spacing:.16em}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(42px,7vw,76px);line-height:1.04;letter-spacing:-.04em;margin:14px 0 22px}h2{font-size:clamp(26px,4vw,40px);line-height:1.16;letter-spacing:-.03em}p{max-width:760px}.lead{font-size:clamp(19px,2.6vw,25px);color:#d5e8f5}.muted{color:var(--muted)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:30px;padding:6px 12px;color:var(--muted);font-size:13px}.primary,.secondary{border:0;border-radius:12px;padding:13px 20px;font-weight:750;min-height:48px}.primary{background:var(--accent);color:#061b24}.secondary{background:var(--panel);color:var(--ink);border:1px solid var(--line)}.primary:hover{background:#9aebf4}.primary:disabled{opacity:.45;cursor:default}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.evidence{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.evidence button{width:100%;border:0;background:transparent;color:var(--accent);text-align:left;padding:18px;font-weight:700;min-height:70px}.evidence p{padding:0 18px 18px;margin:0;overflow-wrap:anywhere}.evidence button span{float:right;color:var(--gold)}.question{border-t ing:14px}.lead{font-size:20px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}:root{--bg:#030906;--panel:#0b1b12;--ink:#edfff1;--muted:#adc8b4;--accent:#7cffa0;--gold:#d5ff78;--line:#28503a}body{background:#030906}#matrix{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.22;z-index:-2}body:before{content:'';position:fixed;inset:0;background:linear-gradient(90deg,#03090644,#030906e6 25%,#030906e6 75%,#03090644);z-index:-1;pointer-events:none}main{position:relative}h1{font-family:system-ui,sans-serif;font-weight:850;text-transform:uppercase;font-size:clamp(38px,7vw,74px);max-width:800px;text-shadow:0 0 45px #53ff9830}h2{font-weight:800}.eyebrow,.pill,.small,.score{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.eyebrow:before{content:'> ';color:#fff}.lead{color:#dcf4e3}.primary{background:var(--accent);border-radius:4px;box-shadow:0 0 22px #69ff9520}.primary:hover{background:#b7ffca;box-shadow:0 0 30px #69ff9544}.secondary,.option,.evidence,.note,textarea,input{border-radius:5px}.evidence{background:linear-gradient(145deg,#10291af2,#07130df5);box-shadow:inset 0 2px #7cffa033}.evidence button[aria-expanded=true]{color:#edfff1}.evidence p{animation:enter .3s ease-out}.option{background:#09180ff2}.option.correct{background:#143b24;border-color:#7cffa0}.option.wrong{background:#3e2027;border-color:#ffaaa2}.feedback{background:#122d1c;border-left-color:#d5ff78}.progress i{box-shadow:0 0 14px #7cffa0}.note{background:#07170ee8}.score{color:#7cffa0}#motion{display:block;margin:12px 0 0 auto;background:#07130d;border:1px solid var(--line);color:var(--muted);padding:6px 10px;font:12px ui-monospace,monospace;border-radius:4px;min-height:36px}@media(max-width:620px){h1{font-size:40px}}
body{isolation:isolate}#matrix{z-index:0;opacity:.3}body:before{z-index:1;background:linear-gradient(90deg,#03090618,#030906dc 22%,#030906dc 78%,#03090618)}main{z-index:2}body>div{position:relative;z-index:3}.cinema{position:relative;margin:24px 0;min-height:145px;display:flex;align-items:center;justify-content:space-between;overflow:hidden;border:1px solid #38784d;background:radial-gradient(ellipse at right,#174c29,#051209 70%);padding:25px 30px;gap:24px;box-shadow:0 0 40px #4cff8a12}.cinema:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#0003 3px 4px);pointer-events:none}.cinema strong{font:700 clamp(20px,3vw,29px)/1.3 ui-monospace,monospace;max-width:470px;position:relative;z-index:1}.cinema small{display:block;color:var(--accent);font:11px ui-monospace,monospace;letter-spacing:.15em;margin-bottom:10px}.portal{flex:none;width:80px;height:110px;border:2px solid #adffbf;box-shadow:0 0 28px #72ff8a88,inset 0 0 20px #72ff8a44;transform:perspective(240px) rotateY(-25deg);background:repeating-linear-gradient(90deg,#0b1e0f 0 5px,#2d6d3c 6px 7px);animation:portal 6s ease-in-out infinite}.missionhud{margin:16px 0 26px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.missionnode{padding:9px 6px;text-align:center;border:1px solid var(--line);color:var(--muted);font:12px ui-monospace,monospace;background:#07170f}.missionnode.current{border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px #6bff8b22}.missionnode.done{background:#143b24;color:#d8ffe4}.terminalbar{font:12px ui-monospace,monospace;color:var(--accent);display:flex;justify-content:space-between;gap:15px;margin-bottom:20px}.terminalbar span:last-child{color:var(--muted)}.feedback{animation:enter .35s ease-out}.chips{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.chip{border:1px solid #386e48;background:#0d2415;color:var(--ink);padding:12px 15px;border-radius:4px;min-height:48px;font-size:15px}.chip[aria-pressed=true]{background:var(--accent);color:#06200c;box-shadow:0 0 20px #7cffa044}.chip.used{border-style:dashed;color:var(--muted)}.slotrow{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.slotrow>strong{font:600 14px ui-monospace,monospace;color:var(--accent)}.slot{padding:15px;border:1px dashed #5a8c67;border-radius:4px;text-align:left;min-height:60px;color:var(--ink);background:#0a1b10;font:inherit;cursor:pointer}.slot:not(:disabled):hover{background:#12321d}.slot.good{border:1px solid #7cffa0}.slot.bad{border:1px solid #ffaaa2}.bonushint{grid-column:2;font-size:14px;color:var(--gold)}.triage{padding:22px;border:1px solid var(--line);background:#091b11e8;margin:15px 0}.triage h3{margin:0 0 12px;font-size:20px}.triage p{margin:10px 0 17px}.triage button[aria-pressed=true]{background:var(--accent);color:#06200c}.badge{display:inline-flex;gap:10px;align-items:center;border:1px solid var(--accent);padding:12px 18px;color:var(--accent);background:#0e2b19;font:700 15px ui-monospace,monospace;margin-top:14px}.feedback strong:before{content:'> '}.smallhelp{padding:16px;border-left:2px solid var(--accent);margin-top:15px;background:#0b2114}.motion-off *{animation:none!important;transition:none!important}@keyframes portal{50%{box-shadow:0 0 50px #72ff8a77,inset 0 0 30px #72ff8a44}}@media(max-width:620px){.slotrow{grid-template-columns:1fr}.bonushint{grid-column:1}.cinema{padding:20px}.portal{width:45px;height:80px}.missionnode{font-size:11px}.terminalbar{font-size:11px}.triage{padding:16px}}@media(prefers-reduced-motion:reduce){.portal{animation:none}}
</style></head><body><canvas id="matrix" aria-hidden="true"></canvas><div style="max-width:1020px;margin:auto;padding:0 28px"><button id="motion" aria-pressed="true">Pausar lluvia de código</button></div><main id="app"></main><noscript>Activa JavaScript para realizar esta práctica.</noscript><script>const D={"file":"lab-01-mapa-de-riesgos.html","title":"Lo que está en juego","tag":"LAB 01 · CAPÍTULOS 1 Y 2","intro":"Una tienda, cinco incidentes. Descubre qué necesita protección y elige una barrera que tenga sentido.","goal":"Practica activos, amenazas, vulnerabilidades, confidencialidad, integridad, disponibilidad y privacidad.","reflection":"Elige uno de los casos: explica qué activo estaba en juego, qué debilidad permitió el incidente y por qué tu control lo reduce.","cases":[{"title":"El enlace que llegó demasiado lejos","lead":"Lucía comparte con su proveedor una hoja de pedidos. Un cliente descubre que también puede abrirla.","evidence":[["La hoja","Incluye nombres, teléfonos y direcciones de entrega."],["El permiso","Cualquier persona con el enlace puede verla."],["Lo ocurrido","El cliente ha abierto datos de otros compradores; no ha modificado nada."]],"questions":[{"text":"¿Qué objetivo de seguridad se ha visto afectado de forma más directa?","options":["Confidencialidad: personas no autorizadas han visto datos.","Integridad: los pedidos han sido modificados.","Disponibilidad: la hoja ha dejado de funcionar."],"why":"La confidencialidad limita quién accede a la información. Aquí hay acceso no autorizado a datos personales, aunque la hoja siga funcionando y los datos sean correctos."},{"text":"¿Qué cambio reduce la debilidad que lo permitió?","options":["Restringir el acceso a cuentas concretas y compartir solo los datos necesarios.","Cambiar el color de las columnas con datos personales.","Pedir al cliente que no vuelva a abrir el enlace, manteniendo el permiso."],"why":"El permiso abierto es la vulnerabilidad. Restringirlo reduce la exposición; además hay que avisar al responsable para gestionar el acceso que ya ocurrió."}]},{"title":"Un pedido que cambió solo","lead":"Una persona entra con una cuenta compartida y sustituye la dirección de entrega de un pedido.","evidence":[["El activo","El registro de pedidos que utiliza el almacén."],["La cuenta","Todo el equipo utiliza el mismo usuario y contraseña."],["El daño","El paquete se envía a la dirección alterada."]],"questions":[{"text":"¿Qué se ha comprometido principalmente?","options":["La integridad del registro de pedidos.","La disponibilidad del almacén.","Solo la estética del formulario."],"why":"La integridad exige que los datos no se alteren sin autorización. El registro seguía disponible, pero contenía una dirección manipulada."},{"text":"¿Qué combinación responde mejor a este caso?","options":["Cuentas individuales, permisos por función y registro de cambios.","Una contraseña compartida más corta para evitar errores.","Ocultar la dirección al cliente, pero permitir que cualquiera la cambie."],"why":"Las cuentas individuales permiten atribuir acciones; los permisos limitan quién puede modificar datos y el registro ayuda a investigar los cambios. Ninguno garantiza por sí solo seguridad absoluta."}]},{"title":"La tienda desaparece","lead":"Una actualización falla. La web no permite comprar y no existe un procedimiento de recuperación probado.","evidence":[["El servicio","La tienda online está fuera de servicio."],["Lo que sabemos","No hay indicios de robo ni de modificación de datos."],["La copia","Existe una copia, pero nadie ha intentado restaurarla."]],"questions":[{"text":"¿Cuál es el problema confirmado?","options":["Disponibilidad: el servicio no puede utilizarse.","Confidencialidad: sabemos que han robado datos.","Integridad: sabemos que los precios han cambiado."],"why":"Hay que separar hechos de suposiciones. El hecho confirmado es que la tienda no funciona; no se puede afirmar que hubo robo o alteración de datos."},{"text":"¿Qué preparación ayudaría a recuperar el servicio?","options":["Copias separadas y restauraciones probadas, con un procedimiento conocido.","Guardar más copias sin comprobar nunca si funcionan.","Confiar en que el antivirus pueda deshacer cualquier actualización."],"why":"Una copia solo resulta útil para recuperar si está disponible y puede restaurarse. Probarla permite detectar problemas antes del incidente."}]},{"title":"Un formulario demasiado curioso","lead":"La tienda pide fecha de nacimiento completa y DNI para enviar una newsletter de novedades.","evidence":[["La finalidad","Enviar novedades por correo electrónico."],["Los campos","Correo, DNI, fecha de nacimiento y domicilio obligatorios."],["La conservación","La lista se guarda indefinidamente sin revisión."]],"questions":[{"text":"¿Qué principio cuestionarías primero al revisar los campos?","options":["Minimización: se recogen datos que no se necesitan para esa finalidad.","Disponibilidad: debería ser obligatorio rellenar aún más campos.","Integridad: un DNI hace auténtica cualquier suscripción."],"why":"La minimización consiste en recoger solo los datos necesarios para una finalidad. Para este boletín no se justifica pedir DNI o domicilio."},{"text":"¿Qué mejora es coherente con la finalidad y la conservación?","options":["Pedir lo necesario, explicar el uso y fijar una revisión y eliminación cuando deje de estar justificado.","Guardar todo para siempre, por si algún día resulta útil.","Usar la lista para cualquier finalidad sin explicarlo."],"why":"Recoger menos reduce exposición. También debe explicarse el uso y revisarse cuánto tiempo se necesita conservar la información."}]},{"title":"La IA quiere la lista completa","lead":"Lucía quiere que una IA redacte tres ejemplos de mensajes de atención al cliente.","evidence":[["La tarea","Crear ejemplos de redacción, no resolver pedidos reales."],["El archivo","Contiene nombres, correos y reclamaciones de clientes."],["El servicio","Lucía no ha comprobado si está autorizado por su empresa."]],"questions":[{"text":"¿Qué harías antes de subir el archivo?","options":["Comprobar las normas y el servicio, y usar casos ficticios sin datos reales.","Subirlo completo: cuantos más datos, mejor para cualquier tarea.","Quitar solo el nombre, aunque sigan el correo y el teléfono."],"why":"Para crear ejemplos bastan casos ficticios. Quitar el nombre no anonimiza un registro si quedan otros datos que permiten identificar a la persona."},{"text":"Una plataforma deduce que alguien practica running a partir de sus clics. ¿Qué tipo de dato es?","options":["Un dato inferido: se deduce a partir de señales.","Un dato facilitado expresamente por la persona.","Un dato que necesariamente es verdadero porque lo calculó una IA."],"why":"Los clics se registran; el interés se infiere. Una inferencia puede equivocarse y no equivale a una declaración explícita de la persona."}]}]};

const root=document.getElementById('app'); let ci=0,qi=0,answers=[],opened=new Set(),locked=false,reflection='',student='';
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function intro(){root.innerHTML='<div class="eyebrow">'+D.tag+'</div><h1>'+D.title+'</h1><p class="lead">'+D.intro+'</p><p class="muted">'+D.goal+'</p><div class="row"><span class="pill">5 casos · 10 decisiones</span><span class="pill">12–18 minutos</span><span class="pill">Individual o por parejas</span></div><div class="note">Abre las pistas, decide y lee la explicación. Se cuenta tu primera respuesta. Al terminar podrás copiar tus decisiones y una reflexión para Classroom.</div><button class="primary" id="start">Empezar la práctica →</button><p class="small">Los ejemplos son ficticios. Tus respuestas permanecen en esta página durante la sesión; recargarla reinicia la práctica.</p>';document.getElementById('start').onclick=()=>render();}
function render(){locked=false;let c=D.cases[ci],q=c.questions[qi],count=ci*2+qi;let order=[0,1,2];let shift=(ci+qi+1)%3;order=order.slice(shift).concat(order.slice(0,shift));root.innerHTML='<div class="row"><span class="eyebrow">'+D.tag+'</span><span class="pill">Caso '+(ci+1)+' / 5 · Decisión '+(qi+1)+' / 2</span></div><div class="progress" role="progressbar" aria-label="Progreso" aria-valuenow="'+count+'" aria-valuemin="0" aria-valuemax="10"><i style="width:'+count*10+'%"></i></div><h2 tabindex="-1" id="caseTitle">'+c.title+'</h2><p class="lead">'+escape(c.lead)+'</p><p class="small">Toca cada pista para inspeccionarla.</p><div class="cards">'+c.evidence.map((e,i)=>'<div class="evidence"><button aria-expanded="'+opened.has(i)+'" aria-controls="e'+i+'" data-e="'+i+'">'+escape(e[0])+'<span aria-hidden="true">'+(opened.has(i)?'−':'+')+'</span></button><p id="e'+i+'" '+(opened.has(i)?'':'hidden')+'>'+escape(e[1])+'</p></div>').join('')+'</div><div class="question enter"><span class="eyebrow">TU DECISIÓN</span><h3>'+escape(q.text)+'</h3><div class="options">'+order.map((idx,i)=>'<button class="option" data-o="'+idx+'"><b>'+String.fromCharCode(65+i)+'</b><span>'+escape(q.options[idx])+'</span></button>').join('')+'</div><div id="feedback" aria-live="polite"></div><div class="controls"><span class="small">Elige una respuesta.</span><button id="next" class="primary" hidden>Continuar →</button></div></div>';
root.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{let i=+b.dataset.e;if(opened.has(i))opened.delete(i);else opened.add(i);document.getElementById('e'+i).hidden=!opened.has(i);b.setAttribute('aria-expanded',opened.has(i));b.querySelector('span').textContent=opened.has(i)?'−':'+';});
root.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;let choice=+b.dataset.o;answers.push({ci,qi,choice,inspected:opened.size});root.querySelectorAll('[data-o]').forEach(x=>{x.disabled=true;if(+x.dataset.o===0)x.classList.add('correct');else if(x===b)x.classList.add('wrong');});document.getElementById('feedback').innerHTML='<div class="feedback"><strong>'+(choice===0?'Bien razonado.':'Revisa esta decisión.')+'</strong>'+escape(q.why)+'</div>';let next=document.getElementById('next');next.hidden=false;next.textContent=count===9?'Ver mi balance →':'Continuar →';next.onclick=()=>{qi++;if(qi===2){qi=0;ci++;opened=new Set();}if(ci===5)finish();else render();};});document.getElementById('caseTitle').focus();}
function report(){return D.tag+' · '+D.title+'\n'+(student?'Alumno/a: '+student+'\n':'')+'Resultado de práctica: '+answers.filter(a=>a.choice===0).length+'/10 decisiones correctas en el primer intento.\n\n'+answers.map((a,i)=>{let c=D.cases[a.ci],q=c.questions[a.qi];return (i+1)+'. '+c.title+' — '+q.text+'\nMi respuesta: '+q.options[a.choice]+'\nResultado: '+(a.choice===0?'correcta':'a revisar')+'\nClave: '+q.why;}).join('\n\n')+'\n\nMI REFLEXIÓN\n'+reflection+'\n\nRegistro de autoaprendizaje generado en el navegador; no es una certificación de identidad ni una calificación oficial.';}
function finish(){let score=answers.filter(a=>a.choice===0).length;root.innerHTML='<div class="eyebrow">PRÁCTICA COMPLETADA · '+D.tag+'</div><h1>Ahora, explica tu criterio.</h1><div class="score">'+score+'<span style="font-size:.35em;color:var(--muted)"> / 10</span></div><p class="muted">Decisiones correctas en el primer intento. Revisa las explicaciones y redacta tu reflexión; el número por sí solo no cuenta todo lo que has aprendido.</p>'+D.cases.map((c,i)=>{let aa=answers.filter(a=>a.ci===i);return '<details class="review"><summary>'+escape(c.title)+' · '+aa.filter(a=>a.choice===0).length+'/2</summary>'+aa.map(a=>'<p><strong>'+escape(c.questions[a.qi].text)+'</strong><br>Tu respuesta: '+escape(c.questions[a.qi].options[a.choice])+'<br>'+escape(c.questions[a.qi].why)+'</p>').join('')+'</details>';}).join('')+'<label for="student">Nombre o iniciales (opcional)</label><input id="student" maxlength="100" autocomplete="off"><label for="reflection">'+escape(D.reflection)+'</label><textarea id="reflection" placeholder="Escribe aquí tu explicación con tus propias palabras…"></textarea><p class="small">Se copia un resumen de tus respuestas, las explicaciones y esta reflexión. No se envía automáticamente a Classroom.</p><div class="row"><button class="primary" id="copy" disabled>Copiar resultados para Classroom</button><button class="secondary" id="restart">Volver a practicar</button></div><p id="status" role="status"></p><textarea id="fallback" aria-label="Resultados para copiar manualmente" readonly hidden></textarea>';
document.getElementById('reflection').oninput=e=>{reflection=e.target.value;document.getElementById('copy').disabled=!reflection.trim();};document.getElementById('student').oninput=e=>student=e.target.value;
document.getElementById('copy').onclick=async()=>{const output=report(),status=document.getElementById('status'),f=document.getElementById('fallback');try{if(!navigator.clipboard)throw new Error();await navigator.clipboard.writeText(output);status.textContent='Copiado. Pégalo en la tarea de Classroom.';}catch{f.hidden=false;f.value=output;f.focus();f.select();status.textContent='El navegador ha bloqueado la copia automática. El texto está seleccionado: pulsa Ctrl+C o ⌘C y pégalo en Classroom.';}};
document.getElementById('restart').onclick=()=>{if(!confirm('Se borrarán las respuestas de esta sesión. ¿Quieres comenzar de nuevo?'))return;ci=0;qi=0;answers=[];opened=new Set();reflection='';student='';intro();};window.scrollTo(0,0);}
intro();

let bonusDone=false,bonusLog=[],bonusSelected=null,bonusAssignments=[];
const isRisk=D.file.includes('01');
const oldIntro=intro,oldRender=render,oldFinish=finish,oldReport=report;
intro=function(){bonusDone=false;bonusLog=[];bonusAssignments=[];bonusSelected=null;oldIntro();root.querySelector('h1').insertAdjacentHTML('afterend','<div class="cinema" aria-hidden="true"><div><small>SIMULACIÓN DE SEGURIDAD / U02</small><strong>'+(isRisk?'Mira detrás del código.<br>Encuentra el riesgo.':'Parece real.<br>¿También es fiable?')+'</strong></div><div class="portal"></div></div>');root.querySelector('.pill').textContent='5 expedientes + reto final';root.querySelectorAll('.pill')[1].textContent='15–20 minutos';root.querySelector('.note').innerHTML='Tu misión: inspeccionar cinco expedientes y resolver un reto final. Abre las pistas, toma decisiones y aprende de las consecuencias. Sin cuenta atrás: lo importante es tu criterio.';document.getElementById('start').textContent='Entrar en la simulación →';root.querySelector('#start').insertAdjacentHTML('afterend',' <button class="secondary" id="help">Cómo se juega</button><div id="helpText" class="smallhelp" hidden>1. Abre las tres pistas de cada expediente.<br>2. Responde a dos decisiones y lee el feedback.<br>3. Resuelve el reto final y copia tu reflexión para Classroom.<br>No pierdes vidas: equivocarte sirve para aprender.</div>');document.getElementById('help').onclick=()=>{let h=document.getElementById('helpText');h.hidden=!h.hidden;};};
render=function(){oldRender();const previous=answers.filter(a=>a.choice===0).length;root.insertAdjacentHTML('afterbegin','<div class="terminalbar"><span>● CONEXIÓN A LA SIMULACIÓN</span><span>'+previous+' decisiones acertadas</span></div><div class="missionhud" aria-label="Expedientes">'+D.cases.map((c,i)=>'<div class="missionnode '+(i<ci?'done':i===ci?'current':'')+'">'+(i<ci?'✓ ':'')+'CASO 0'+(i+1)+'</div>').join('')+'</div>');window.scrollTo(0,0);};
report=function(){return oldReport()+'\n\nRETO FINAL — '+(isRisk?'Reconstruye el incidente':'Filtra la bandeja')+'\n'+bonusLog.map(x=>x.label+'\nMi elección: '+x.answer+'\n'+(x.ok?'Correcto.':'A revisar.')+' '+x.why).join('\n\n');};
finish=function(){if(!bonusDone){challenge();return;}oldFinish();root.querySelector('h1').insertAdjacentHTML('afterend','<div class="badge">◇ SIMULACIÓN COMPLETADA</div>');root.querySelector('.score').insertAdjacentHTML('afterend','<p class="muted">Reto final: '+bonusLog.filter(x=>x.ok).length+' / '+bonusLog.length+' aciertos. Las decisiones de los expedientes y el reto se muestran por separado.</p>');};
const chain={title:'Reconstruye el incidente',lead:'Una persona ajena entra en la hoja de pedidos usando un enlace público y descarga las direcciones de clientes. Reconstruye la cadena del riesgo.',labels:['Activo','Amenaza','Vulnerabilidad','Daño','Barrera'],tokens:['Direcciones de los clientes','Acceso y extracción por una persona no autorizada','Permiso «cualquiera con el enlace»','Pérdida de confidencialidad de los datos','Acceso restringido a las cuentas que lo necesitan'],why:['El activo es la información que tiene valor y necesita protección.','La amenaza es la posible acción que compromete la seguridad.','El permiso abierto es la debilidad que facilita ese acceso.','El daño observado es que los datos quedan expuestos a alguien no autorizado.','Restringir el acceso reduce esa vulnerabilidad; también hay que gestionar el incidente ya ocurrido.']};
const inbox=[{title:'El envío que esperabas',text:'Dentro de la aplicación del proveedor que has abierto desde tu acceso habitual aparece el pedido que hiciste ayer. Solo informa de su salida; no pide pagos, claves ni cambios.',correct:0,why:'Con los datos disponibles, puedes continuar por el canal habitual. No hay una petición sensible inesperada; eso no implica que cualquier mensaje similar sea auténtico.'},{title:'Un pago pendiente',text:'Un correo con el logotipo habitual pide transferir hoy a una cuenta distinta. El remitente parece correcto, pero no esperabas ningún cambio.',correct:1,why:'Un remitente conocido también puede estar comprometido. Un cambio de cuenta bancaria se verifica por otro canal que ya conocías.'},{title:'Actualización desde el propio sistema',text:'Abres la configuración del sistema de tu equipo y buscas actualizaciones. Aparece una actualización disponible desde su canal oficial, sin pedir que desactives protecciones.',correct:0,why:'Actualizar desde el canal oficial es una medida preventiva. Sigue las normas de tu centro o empresa y las indicaciones del sistema.'},{title:'El cupón con candado',text:'Una página a la que llegas desde un correo inesperado promete un descuento. Usa HTTPS y exige instalar una extensión para obtenerlo.',correct:1,why:'HTTPS no acredita la legitimidad de la oferta. Instalar software o conceder permisos requiere comprobar origen y necesidad.'}];
function challenge(){root.innerHTML='<div class="eyebrow">ÚLTIMA MISIÓN · '+D.tag+'</div><h1 tabindex="-1" id="bonusTitle">'+(isRisk?chain.title:'Filtra la bandeja')+'</h1><p class="lead">'+(isRisk?chain.lead:'No todo es un ataque. Decide cuándo puedes continuar por el canal habitual y cuándo necesitas verificar antes de actuar.')+'</p><div id="challenge"></div><p id="bonusStatus" role="status"></p><button id="checkBonus" class="primary" disabled>Comprobar mi análisis →</button><div id="bonusFeedback" aria-live="polite"></div><button id="bonusNext" class="primary" hidden>Ver resultados y reflexionar →</button>';let area=document.getElementById('challenge');if(isRisk){area.innerHTML='<p class="small">Selecciona una tarjeta y toca el hueco donde encaja. Puedes cambiarla antes de comprobar.</p><div class="chips">'+[2,4,0,3,1].map(i=>'<button class="chip" data-token="'+i+'" aria-pressed="false">'+escape(chain.tokens[i])+'</button>').join('')+'</div>'+chain.labels.map((label,i)=>'<div class="slotrow"><strong>'+label+'</strong><button class="slot" data-slot="'+i+'">Selecciona una tarjeta…</button><div class="bonushint" id="hint'+i+'"></div></div>').join('');root.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{bonusSelected=+b.dataset.token;root.querySelectorAll('[data-token]').forEach(x=>x.setAttribute('aria-pressed',x===b));document.getElementById('bonusStatus').textContent='Ahora elige el hueco donde colocarla.';});root.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{if(bonusSelected===null){document.getElementById('bonusStatus').textContent='Selecciona primero una tarjeta de arriba.';return;}bonusAssignments=bonusAssignments.map(v=>v===bonusSelected?undefined:v);bonusAssignments[+b.dataset.slot]=bonusSelected;root.querySelectorAll('[data-slot]').forEach(x=>{let v=bonusAssignments[+x.dataset.slot];x.textContent=v===undefined?'Selecciona una tarjeta…':chain.tokens[v];});root.querySelectorAll('[data-token]').forEach(x=>{x.classList.toggle('used',bonusAssignments.includes(+x.dataset.token));x.setAttribute('aria-pressed','false');});bonusSelected=null;document.getElementById('bonusStatus').textContent='Tarjeta colocada. Puedes recolocarla antes de comprobar.';updateBonusReady(5);});}else{area.innerHTML=inbox.map((m,i)=>'<article class="triage"><div class="eyebrow">MENSAJE 0'+(i+1)+'</div><h3>'+m.title+'</h3><p>'+m.text+'</p><div class="row"><button class="chip" data-msg="'+i+'" data-choice="0" aria-pressed="false">Continuar por el canal habitual</button><button class="chip" data-msg="'+i+'" data-choice="1" aria-pressed="false">Verificar antes de actuar</button></div><p class="bonushint" id="hint'+i+'"></p></article>').join('');root.querySelectorAll('[data-msg]').forEach(b=>b.onclick=()=>{bonusAssignments[+b.dataset.msg]=+b.dataset.choice;root.querySelectorAll('[data-msg="'+b.dataset.msg+'"]').forEach(x=>x.setAttribute('aria-pressed',x===b));updateBonusReady(4);});}document.getElementById('checkBonus').onclick=checkBonus;document.getElementById('bonusNext').onclick=finish;document.getElementById('bonusTitle').focus();window.scrollTo(0,0);}
function updateBonusReady(n){document.getElementById('checkBonus').disabled=Array.from({length:n},(_,i)=>bonusAssignments[i]).some(v=>v===undefined);}
function checkBonus(){if(bonusDone)return;bonusDone=true;let n=isRisk?5:4;for(let i=0;i<n;i++){let selected=bonusAssignments[i],correct=isRisk?i:inbox[i].correct,ok=selected===correct,why=isRisk?chain.why[i]:inbox[i].why;bonusLog.push({label:isRisk?chain.labels[i]:inbox[i].title,answer:isRisk?chain.tokens[selected]:selected===0?'Continuar por el canal habitual':'Verificar antes de actuar',ok,why});document.getElementById('hint'+i).textContent=(ok?'✓ Correcto. ':'↳ Revisa: ')+(isRisk&&!ok?chain.tokens[i]+'. ':'')+why;}root.querySelectorAll('[data-token],[data-slot],[data-msg]').forEach(b=>b.disabled=true);document.getElementById('checkBonus').hidden=true;document.getElementById('bonusStatus').textContent='Análisis completado: '+bonusLog.filter(x=>x.ok).length+' / '+n+'. Lee las explicaciones antes de continuar.';document.getElementById('bonusNext').hidden=false;}
intro();

const canvas=document.getElementById('matrix'),ctx=canvas.getContext('2d'),motion=document.getElementById('motion');let running=!matchMedia('(prefers-reduced-motion: reduce)').matches,drops=[],last=0;function resizeMatrix(){canvas.width=innerWidth;canvas.height=innerHeight;drops=Array.from({length:Math.ceil(innerWidth/24)},()=>Math.random()*-60);}resizeMatrix();addEventListener('resize',resizeMatrix);function labelMotion(){motion.textContent=running?'Pausar lluvia de código':'Activar lluvia de código';motion.setAttribute('aria-pressed',String(running));}motion.onclick=()=>{running=!running;labelMotion();};labelMotion();function rain(t){requestAnimationFrame(rain);if(!running||document.hidden||t-last<85)return;last=t;ctx.fillStyle='rgba(3,9,6,.09)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.font='15px monospace';drops.forEach((y,i)=>{ctx.fillStyle=Math.random()>.97?'#e4ffec':'#42ec7d';ctx.fillText('01アイウエオカキクケコ'[Math.floor(Math.random()*12)],i*24,y*22);drops[i]=y*22>canvas.height&&Math.random()>.975?0:y+1;});}requestAnimationFrame(rain);</script></body></html>
