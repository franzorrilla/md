<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambridge Analytica · Tus datos, sus decisiones</title><meta name="description" content="Presentación interactiva de Marketing Digital · Unidad 02 · Fran Zorrilla"><style>*{box-sizing:border-box} :root{--bg:#080d14;--panel:#111e29;--ink:#f3f8f8;--muted:#aebfc9;--a:#63f8cf}body{margin:0;background:var(--bg);color:var(--ink);font:clamp(16px,1.65vw,24px)/1.45 system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,#45ffd008 1px,transparent 1px),linear-gradient(#45ffd008 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(#000,transparent)}header,footer{display:flex;align-items:center;gap:16px;padding:15px 4vw;position:relative;z-index:2}header{border-bottom:1px solid #ffffff18;font-size:13px;letter-spacing:.12em}header strong{color:var(--a)}header span{margin-right:auto}button,select,summary,a{touch-action:manipulation}button,select{font:inherit;color:inherit;background:#14232e;border:1px solid #44606c;border-radius:8px;padding:12px 18px;cursor:pointer}button:hover,button[aria-pressed=true]{background:var(--a);color:#07161b;border-color:var(--a)}button:disabled{opacity:.35;cursor:default}a{color:inherit}button:focus-visible,a:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--a);outline-offset:4px}select{max-width:240px;font-size:13px}main{max-width:1440px;margin:auto;position:relative;min-height:calc(100svh - 145px)}section{padding:3vh 5vw 2vh;animation:enter .35s ease;position:relative;overflow:hidden}.eyebrow{color:var(--a);text-transform:uppercase;font:600 12px/1.5 ui-monospace,monospace;letter-spacing:.18em;margin:0 0 16px}h1{font-size:clamp(38px,5.4vw,78px);line-height:1.04;letter-spacing:-.055em;margin:0 0 26px;max-width:1100px}em{font-style:normal;color:var(--a)}h3{font-size:clamp(21px,2vw,30px);line-height:1.15;margin:12px 0}p{margin:12px 0}.lead{font-size:clamp(22px,2.3vw,34px);line-height:1.36;max-width:930px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:22px 0}.three{grid-template-columns:repeat(3,1fr)}.card{background:linear-gradient(130deg,#172936,#111922);border:1px solid #ffffff22;border-radius:12px;padding:22px}.num{color:var(--a);font:16px ui-monospace,monospace}.card p{color:#cad7df}.callout,.prompt{border-left:3px solid var(--a);padding:14px 20px;margin-top:24px;background:#63f8cf09}.caption{color:var(--muted);font-size:clamp(13px,1.2vw,17px);max-width:1050px}.split{display:grid;grid-template-columns:1fr 1.25fr;gap:40px;align-items:center}.steps,.opinion{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.steps button{flex:1;white-space:nowrap}.flow-panel{border:1px solid var(--a);border-radius:10px;padding:24px;min-height:150px;background:#102a30}.flow-panel h3{color:var(--a);margin-top:0}details{background:#13232e;border:1px solid #385261;border-radius:10px;margin:12px 0;padding:18px}summary{cursor:pointer;font-weight:650;list-style:none;display:flex;justify-content:space-between;gap:14px}summary span{color:var(--a)}details p{color:#cfdee6;font-size:.9em}.stat{font-weight:800;font-size:clamp(68px,10vw,145px);line-height:1;color:var(--a);letter-spacing:-.06em}.stat span{display:block;font-size:clamp(18px,2vw,28px);letter-spacing:0;margin:14px 0}.source{display:flex;justify-content:space-between;align-items:center;text-decoration:none;padding:22px 0;border-bottom:1px solid #465662;font-size:clamp(21px,2.2vw,32px)}.source small{display:block;font-size:15px;color:var(--muted);margin-top:7px}.source b{font-size:36px;color:var(--a)}.source:hover{color:var(--a)}footer{max-width:1440px;margin:auto;font-size:14px}footer #count{margin-right:auto;font-variant-numeric:tabular-nums}footer button{font-size:17px}.progress{height:3px;background:#24313c;position:fixed;bottom:0;width:100%}.progress i{display:block;height:100%;background:var(--a);transition:width .3s}.hero-art{float:right;width:33%;height:270px;position:relative;margin:10px 0 20px 35px}.orbit{position:absolute;inset:50px;border:1px solid var(--a);border-radius:50%;display:grid;place-items:center;background:#63f8cf12;box-shadow:0 0 90px #63f8cf18;font:700 40px ui-monospace,monospace}.sat{position:absolute;font:12px ui-monospace,monospace;padding:12px;background:#17313b;border:1px solid var(--a);animation:float 5s ease-in-out infinite}.s1{top:20px;left:0}.s2{top:100px;right:0;animation-delay:-2s}.s3{bottom:10px;left:20px;animation-delay:-3s}.glass{height:280px;border:1px solid #77ffcf77;background:linear-gradient(125deg,#77ffcf1c,transparent);border-radius:24px;display:grid;place-content:center;text-align:center;transform:perspective(800px) rotateY(12deg);box-shadow:18px 18px 0 #77ffcf0c}.glass span{font-size:130px;line-height:1.2;color:var(--a)}.glass div{font:12px monospace;letter-spacing:.15em}.server{border:1px solid var(--a);border-radius:20px;padding:40px 25px;font:bold 60px monospace;color:var(--a);background:#62cfff0d;box-shadow:0 0 60px #62cfff15;transform:rotate(-6deg)}.server span{display:block;font-size:15px;letter-spacing:.5em;margin-top:20px}.rays{font:11px monospace;text-align:center;margin-top:26px}.memory{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px;border:1px solid #3d5969;border-radius:12px;margin:20px 0;font-size:17px}.memory b{color:#ffb6a0}.broken{background:#6a282e;padding:14px;border-radius:8px}.scale{border-top:1px solid var(--a);border-bottom:1px solid var(--a);padding:24px 0;margin:24px 0}.scale strong,.scale span{display:block}.scale strong{font-size:clamp(25px,3vw,42px)}.scale span{color:var(--muted)}.stack{display:grid;gap:10px}.stack span,.stack strong{border:1px solid #486475;border-radius:8px;padding:18px}.stack strong{background:var(--a);color:#08141a}.decisions{display:grid;gap:12px;margin:20px 0}.decisions button{text-align:left}.feedback{border-left:3px solid var(--a);padding:16px 20px;background:#132632;font-size:.95em;min-height:90px}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes float{50%{transform:translateY(-9px)}}@media(min-width:1000px) and (min-height:780px){section{padding-top:5vh}}@media(max-width:700px){header{padding:12px 18px;gap:8px}header span{font-size:10px}header select{max-width:145px}#full{display:none}section{padding:28px 22px;overflow:visible}h1{margin-bottom:22px}.grid,.three,.split{grid-template-columns:1fr;gap:12px}.hero-art{float:none;width:100%;height:210px;margin:10px 0 30px}.orbit{inset:25px 28%}.sat.s1{left:8%}.sat.s2{right:8%}.server-art{height:180px;width:220px;margin:30px auto}.server{padding:16px 25px;font-size:44px}.rays{margin-top:15px}.steps{display:grid;grid-template-columns:1fr 1fr}.steps button{white-space:normal;padding:12px;font-size:16px}.glass{height:180px}.glass span{font-size:85px}.memory{flex-wrap:wrap;justify-content:center}.card{padding:20px}.source{gap:12px}.source small{font-size:13px}footer{padding:15px 20px 22px}main{min-height:calc(100svh - 150px)}.opinion button{flex:1;font-size:16px}.stat{font-size:72px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}:root{--a:#63f8cf}</style></head><body><header><strong>MD / 02</strong><span>DATOS Y PRIVACIDAD</span><select aria-label="Ir a diapositiva"></select><button id="full" aria-label="Pantalla completa">⛶</button></header><main></main><footer><span id="count" aria-live="polite"></span><button id="prev" aria-label="Diapositiva anterior">←</button><button id="next" aria-label="Diapositiva siguiente">Siguiente →</button></footer><div class="progress" aria-hidden="true"><i></i></div><script>const pages=[{"id": "inicio", "label": "El caso", "title": "Tu test.<br><em>Sus datos.</em>", "body": "<div class=\"hero-art\" aria-hidden=\"true\"><div class=\"orbit\">TÚ</div><div class=\"sat s1\">AMIGOS</div><div class=\"sat s2\">PERFILES</div><div class=\"sat s3\">ANUNCIOS</div></div><p class=\"lead\">Cambridge Analytica: cómo un test de personalidad acabó alimentando publicidad política.</p><p class=\"prompt\">¿Puedes exponer datos de alguien que nunca hizo clic?</p>"}, {"id": "recorrido", "label": "Cómo ocurrió", "title": "Un clic que <em>se multiplicaba.</em>", "body": "<p>Pulsa los pasos y sigue el recorrido de la información.</p><div class=\"steps\" data-flow=\"ca\"><button data-step=\"0\">01 · Test</button><button data-step=\"1\">02 · Amigos</button><button data-step=\"2\">03 · Perfiles</button><button data-step=\"3\">04 · Mensajes</button></div><div class=\"flow-panel\" aria-live=\"polite\"></div><p class=\"caption\">Facebook daba acceso técnico; la app de Aleksandr Kogan recogía datos; Cambridge Analytica los utilizaba. Eran actores distintos.</p>"}, {"id": "casa", "label": "La casa de cristal", "title": "Tu llave abre <em>otras ventanas.</em>", "body": "<div class=\"split\"><div class=\"glass\" aria-hidden=\"true\"><span>⌂</span><div>TU CASA · AMISTADES</div><i></i></div><div><p class=\"lead\">Prestas una llave para enseñar tu salón. Pero permite mirar también las casas de tus amigos.</p><details><summary>¿Qué representa la llave? <span>＋</span></summary><p>Los permisos de acceso. La antigua herramienta de Facebook permitía a la app obtener ciertos datos de amistades que no habían hecho el test.</p></details><details><summary>¿Dónde se rompe la confianza? <span>＋</span></summary><p>En el alcance del acceso y en el uso engañoso de la información. No basta con que una persona pulse «aceptar».</p></details></div></div><p class=\"caption\">La casa de cristal es una analogía; no describe literalmente el sistema técnico.</p>"}, {"id": "marketing", "label": "La conexión con MD", "title": "Un perfil <em>no lee la mente.</em>", "body": "<div class=\"grid three\"><article class=\"card\"><span class=\"num\">01</span><h3>Observar</h3><p>Sigues páginas de senderismo.</p></article><article class=\"card\"><span class=\"num\">02</span><h3>Inferir</h3><p>Quizá te interesan los viajes de aventura.</p></article><article class=\"card\"><span class=\"num\">03</span><h3>Segmentar</h3><p>Te muestran una escapada de montaña.</p></article></div><p class=\"caption\">Ejemplo ficticio. Una inferencia puede equivocarse.</p><div class=\"callout\">Orientar mensajes políticos no demuestra, por sí solo, que esos mensajes decidieran unas elecciones.</div>"}, {"id": "actualidad", "label": "La noticia · 21/10/2026", "title": "El coste de <em>engañar.</em>", "body": "<div class=\"stat\">25.000 <span>millones de dólares</span></div><p class=\"lead\">Sanción judicial a Meta en Nuevo México por engañar a consumidores sobre la privacidad de Facebook.</p><div class=\"grid\"><article class=\"card\"><span class=\"num\">↗</span><h3>Recurso anunciado</h3><p>Meta prevé recurrir. No equivale a un pago ya realizado ni a una resolución firme.</p></article><article class=\"card\"><span class=\"num\">US</span><h3>El marco importa</h3><p>Es una causa estadounidense vinculada al caso. No es una multa de la AEPD ni del RGPD.</p></article></div><p class=\"caption\">Fuente: Reuters, 21/10/2026. Estado de la noticia a 22/10/2026.</p>"}, {"id": "debate", "label": "Toma posición", "title": "«Si acepto, <em>todo vale».</em>", "body": "<p class=\"lead\">¿Aceptar un test autoriza a utilizar los datos de tus amigos para cualquier fin?</p><div class=\"opinion\"><button data-opinion=\"Acepto la afirmación\">Estoy de acuerdo</button><button data-opinion=\"Depende de las condiciones\">Depende</button><button data-opinion=\"Rechazo la afirmación\">Estoy en desacuerdo</button></div><p class=\"choice\" aria-live=\"polite\">Elige una postura y explica una razón.</p><details><summary>Ahora añade este dato <span>＋</span></summary><p>Muchos afectados no habían utilizado el test. ¿Mantienes tu postura? Explica quién podía decidir sobre esos datos.</p></details><p class=\"caption\">Debate: no hay una puntuación. La selección solo se mantiene mientras la página siga abierta.</p>"}, {"id": "agencia", "label": "Tu decisión profesional", "title": "Una campaña que <em>sí firmarías.</em>", "body": "<p class=\"lead\">Una academia propone un test profesional, recoger contactos y vender cursos explotando inseguridades.</p><p class=\"caption\">Encargo ficticio. Propón un cambio antes de abrir cada tarjeta.</p><div class=\"grid three\"><details><summary>01 · ¿Qué retirarías? <span>＋</span></summary><p>La recogida de contactos ajenos y el perfilado de inseguridades.</p></details><details><summary>02 · ¿Qué dato pedirías? <span>＋</span></summary><p>Un interés formativo declarado. Solo lo necesario y con una finalidad clara.</p></details><details><summary>03 · ¿Qué explicarías? <span>＋</span></summary><p>Para qué usarás los datos y cómo dejar de recibir publicidad. Revisarías la base jurídica y los proveedores antes de lanzar la campaña.</p></details></div><div class=\"callout\">La pregunta profesional: ¿de dónde sale el dato y para qué lo voy a usar?</div>"}, {"id": "fuentes", "label": "Para contrastar", "title": "Las fuentes, <em>a un clic.</em>", "body": "<a class=\"source\" href=\"https://www.ftc.gov/business-guidance/blog/2019/07/ftc-sues-cambridge-analytica-deceptive-claims-about-consumers-personal-information\" target=\"_blank\" rel=\"noopener\"><span>FTC · El mecanismo<small>Cómo el test alcanzaba a usuarios y amistades · julio de 2019</small></span><b aria-hidden=\"true\">↗</b></a><a class=\"source\" href=\"https://www.ftc.gov/news-events/news/press-releases/2019/12/ftc-issues-opinion-order-against-cambridge-analytica-deceiving-consumers-about-collection-facebook\" target=\"_blank\" rel=\"noopener\"><span>FTC · La resolución<small>Prácticas engañosas para obtener datos y perfilar votantes · diciembre de 2019</small></span><b aria-hidden=\"true\">↗</b></a><a class=\"source\" href=\"https://www.reuters.com/business/meta-ordered-pay-25-billion-new-mexico-after-jury-finds-company-misled-consumers-2026-10-21/\" target=\"_blank\" rel=\"noopener\"><span>Reuters · La sanción reciente<small>Nuevo México, cuantía y recurso anunciado · 21/10/2026</small></span><b aria-hidden=\"true\">↗</b></a><p class=\"caption\">Versión breve del material original · MD / U02 · Actualidad revisada: 22/10/2026. Las analogías y la campaña de la academia son ejemplos didácticos.</p>"}];const stage=document.querySelector('main'),menu=document.querySelector('select');let index=0;const states={};menu.innerHTML=pages.map((p,i)=>`<option value="${i}">${i+1} · ${p.label}</option>`).join('');
const flows={ca:[['Una persona hace el test','La app pide conectar su cuenta de Facebook y obtiene información.'],['El alcance se amplía','La antigua API —la conexión entre programas— permitía acceder a ciertos datos de amigos que no habían usado la app.'],['Se construyen perfiles','La información sirve para inferir características de las personas y agruparlas.'],['Se orientan mensajes políticos','Cambridge Analytica utiliza perfiles para seleccionar públicos. La FTC concluyó que hubo prácticas engañosas en la obtención de datos.']],php:[['Tú pides una página','Por ejemplo, abres el catálogo de una tienda desde el móvil.'],['El servidor prepara el contenido','PHP ejecuta instrucciones y puede consultar productos en una base de datos.'],['El navegador muestra el resultado','Recibes una página que puedes ver e interactuar con ella. Esquema didáctico simplificado.']]};
function draw(){let p=pages[index];stage.innerHTML=`<section aria-labelledby="heading"><div class="eyebrow">${String(index+1).padStart(2,'0')} / ${p.label}</div><h1 id="heading">${p.title}</h1>${p.body}</section>`;menu.value=index;document.querySelector('#count').textContent=`${index+1} / ${pages.length}`;document.querySelector('#prev').disabled=!index;document.querySelector('#next').disabled=index===pages.length-1;document.querySelector('.progress i').style.width=(index+1)/pages.length*100+'%';
let flow=stage.querySelector('[data-flow]');if(flow){let key=flow.dataset.flow;const show=n=>{states[p.id]=n;flow.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',i===n));let f=flows[key][n];stage.querySelector('.flow-panel').innerHTML=`<h3>${f[0]}</h3><p>${f[1]}</p>`};flow.querySelectorAll('button').forEach(b=>b.onclick=()=>show(+b.dataset.step));show(states[p.id]||0)}
stage.querySelectorAll('details').forEach((d,i)=>{d.open=!!states[p.id+'detail'+i];d.ontoggle=()=>states[p.id+'detail'+i]=d.open});
function opinion(v){states.opinion=v;stage.querySelectorAll('[data-opinion]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.opinion===v));stage.querySelector('.choice').textContent='Tu postura: '+v+'. ¿Qué argumento la sostiene?'}stage.querySelectorAll('[data-opinion]').forEach(b=>b.onclick=()=>opinion(b.dataset.opinion));if(p.id==='debate'&&states.opinion)opinion(states.opinion);
function decision(n){states.decision=n;stage.querySelectorAll('[data-decision]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.decision===n));stage.querySelector('.feedback').textContent=['Que la tienda funcione no descarta una vulnerabilidad. Primero necesitas confirmar su situación técnica.','Buena primera acción: confirmar exposición y corrección con quien administra PHP. Después hay que verificar el servicio y revisar indicios de incidentes.','Cambiar una contraseña no corrige un fallo del motor PHP. La prioridad es confirmar la actualización; otras medidas dependerán de lo investigado.'][n]}stage.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>decision(+b.dataset.decision));if(p.id==='decision'&&states.decision!==undefined)decision(states.decision);}
function go(n){index=Math.max(0,Math.min(pages.length-1,n));history.replaceState(null,'','#'+pages[index].id);draw();window.scrollTo(0,0)}document.querySelector('#prev').onclick=()=>go(index-1);document.querySelector('#next').onclick=()=>go(index+1);menu.onchange=()=>go(+menu.value);document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.querySelector('#count').textContent='Abre la URL en otra pestaña para ampliar.'}};document.addEventListener('keydown',e=>{if(['BUTTON','SELECT','SUMMARY','INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});window.addEventListener('hashchange',()=>{let n=pages.findIndex(p=>p.id===location.hash.slice(1));if(n>=0){index=n;draw()}});let initial=pages.findIndex(p=>p.id===location.hash.slice(1));if(initial>=0)index=initial;draw();</script></body></html>
