rgin:12px 0}.lead{font-size:clamp(22px,2.3vw,34px);line-height:1.36;max-width:930px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:22px 0}.three{grid-template-columns:repeat(3,1fr)}.card{background:linear-gradient(130deg,#172936,#111922);border:1px solid #ffffff22;border-radius:12px;padding:22px}.num{color:var(--a);font:16px ui-monospace,monospace}.card p{color:#cad7df}.callout,.prompt{border-left:3px solid var(--a);padding:14px 20px;margin-top:24px;background:#63f8cf09}.caption{color:var(--muted);font-size:clamp(13px,1.2vw,17px);max-width:1050px}.split{display:grid;grid-template-columns:1fr 1.25fr;gap:40px;align-items:center}.steps,.opinion{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.steps button{flex:1;white-space:nowrap}.flow-panel{border:1px solid var(--a);border-radius:10px;padding:24px;min-height:150px;background:#102a30}.flow-panel h3{color:var(--a);margin-top:0}details{background:#13232e;border:1px solid #385261;border-radius:10px;margin:12px 0;padding:18px}summary{cursor:pointer;font-weight:650;list-style:none;display:flex;justify-content:space-between;gap:14px}summary span{color:var(--a)}details p{color:#cfdee6;font-size:.9em}.stat{font-weight:800;font-size:clamp(68px,10vw,145px);line-height:1;color:var(--a);letter-spacing:-.06em}.stat span{display:block;font-size:clamp(18px,2vw,28px);letter-spacing:0;margin:14px 0}.source{display:flex;justify-content:space-between;align-items:center;text-decoration:none;padding:22px 0;border-bottom:1px solid #465662;font-size:clamp(21px,2.2vw,32px)}.source small{display:block;font-size:15px;color:var(--muted);margin-top:7px}.source b{font-size:36px;color:var(--a)}.source:hover{color:var(--a)}footer{max-width:1440px;margin:auto;font-size:14px}footer #count{margin-right:auto;font-variant-numeric:tabular-nums}footer button{font-size:17px}.progress{height:3px;background:#24313c;position:fixed;bottom:0;width:100%}.progress i{display:block;height:100%;background:var(--a);transition:width .3s}.hero-art{float:right;width:33%;height:270px;position:relative;margin:10px 0 20px 35px}.orbit{position:absolute;inset:50px;border:1px solid var(--a);border-radius:50%;display:grid;place-items:center;background:#63f8cf12;box-shadow:0 0 90px #63f8cf18;font:700 40px ui-monospace,monospace}.sat{position:absolute;font:12px ui-monospace,monospace;padding:12px;background:#17313b;border:1px solid var(--a);animation:float 5s ease-in-out infinite}.s1{top:20px;left:0}.s2{top:100px;right:0;animation-delay:-2s}.s3{bottom:10px;left:20px;animation-delay:-3s}.glass{height:280px;border:1px solid #77ffcf77;background:linear-gradient(125deg,#77ffcf1c,transparent);border-radius:24px;display:grid;place-content:center;text-align:center;transform:perspective(800px) rotateY(12deg);box-shadow:18px 18px 0 #77ffcf0c}.glass span{font-size:130px;line-height:1.2;color:var(--a)}.glass div{font:12px monospace;letter-spacing:.15em}.server{border:1px solid var(--a);border-radius:20px;padding:40px 25px;font:bold 60px monospace;color:var(--a);background:#62cfff0d;box-shadow:0 0 60px #62cfff15;transform:rotate(-6deg)}.server span{display:block;font-size:15px;letter-spacing:.5em;margin-top:20px}.rays{font:11px monospace;text-align:center;margin-top:26px}.memory{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px;border:1px solid #3d5969;border-radius:12px;margin:20px 0;font-size:17px}.memory b{color:#ffb6a0}.broken{background:#6a282e;padding:14px;border-radius:8px}.scale{border-top:1px solid var(--a);border-bottom:1px solid var(--a);padding:24px 0;margin:24px 0}.scale strong,.scale span{display:block}.scale strong{font-size:clamp(25px,3vw,42px)}.scale span{color:var(--muted)}.stack{display:grid;gap:10px}.stack span,.stack strong{border:1px solid #486475;border-radius:8px;padding:18px}.stack strong{background:var(--a);color:#08141a}.decisions{display:grid;gap:12px;margin:20px 0}.decisions button{text-align:left}.feedback{border-left:3px solid var(--a);padding:16px 20px;background:#132632;font-size:.95em;min-height:90px}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes float{50%{transform:translateY(-9px)}}@media(min-width:1000px) and (min-height:780px){section{padding-top:5vh}}@media(max-width:700px){header{padding:12px 18px;gap:8px}header span{font-size:10px}header select{max-width:145px}#full{display:none}section{padding:28px 22px;overflow:visible}h1{margin-bottom:22px}.grid,.three,.split{grid-template-columns:1fr;gap:12px}.hero-art{float:none;width:100%;height:210px;margin:10px 0 30px}.orbit{inset:25px 28%}.sat.s1{left:8%}.sat.s2{right:8%}.server-art{height:180px;width:220px;margin:30px auto}.server{padding:16px 25px;font-size:44px}.rays{margin-top:15px}.steps{display:grid;grid-template-columns:1fr 1fr}.steps button{white-space:normal;padding:12px;font-size:16px}.glass{height:180px}.glass span{font-size:85px}.memory{flex-wrap:wrap;justify-content:center}.card{padding:20px}.source{gap:12px}.source small{font-size:13px}footer{padding:15px 20px 22px}main{min-height:calc(100svh - 150px)}.opinion button{flex:1;font-size:16px}.stat{font-size:72px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}:root{--a:#70d4ff}</style></head><body><header><strong>MD / 02</strong><span>SEGURIDAD E IA</span><select aria-label="Ir a diapositiva"></select><button id="full" aria-label="Pantalla completa">⛶</button></header><main></main><footer><span id="count" aria-live="polite"></span><button id="prev" aria-label="Diapositiva anterior">←</button><button id="next" aria-label="Diapositiva siguiente">Siguiente →</button></footer><div class="progress" aria-hidden="true"><i></i></div><script>const pages=[{"id": "inicio", "label": "PHP2Shell · Octubre de 2026", "title": "Un fallo.<br><em>Muchas webs.</em>", "body": "<div class=\"hero-art server-art\" aria-hidden=\"true\"><div class=\"server\">PHP<span>● ● ●</span></div><div class=\"rays\">TIENDAS / MEDIOS / SERVICIOS</div></div><p class=\"lead\">Un componente compartido de Internet contiene fallos críticos. La IA ayuda a demostrar su alcance.</p><p class=\"prompt\">¿Quién protege lo que hay detrás de tu web?</p>"}, {"id": "php", "label": "Primero, lo esencial", "title": "PHP trabaja <em>entre bastidores.</em>", "body": "<p class=\"lead\">Es un lenguaje que se ejecuta en el servidor para generar páginas y procesar información.</p><div class=\"steps\" data-flow=\"php\"><button data-step=\"0\">01 · Navegador</button><button data-step=\"1\">02 · Servidor / PHP</button><button data-step=\"2\">03 · Respuesta</button></div><div class=\"flow-panel\" aria-live=\"polite\"></div><p class=\"caption\">WordPress, Drupal y Joomla usan PHP. El navegador recibe el resultado, no el código PHP del servidor.</p>"}, {"id": "fallo", "label": "Qué se descubrió", "title": "El motor dejaba <em>restos peligrosos.</em>", "body": "<div class=\"memory\" aria-hidden=\"true\"><span>Petición</span><b>ERROR</b><span class=\"broken\">Memoria alterada</span><b>→</b><span>Siguiente petición</span></div><p class=\"lead\">Al gestionar ciertos errores, PHP podía conservar un estado de memoria incorrecto y reutilizarlo después.</p><div class=\"grid\"><article class=\"card\"><span class=\"num\">01</span><h3>Leer información</h3><p>Algunos fallos permitían acceder a datos de la memoria del proceso.</p></article><article class=\"card\"><span class=\"num\">02</span><h3>Ejecutar código</h3><p>Otros podían permitir tomar control del servidor afectado, sin iniciar sesión.</p></article></div><p class=\"caption\">CVE-2026-109618 y CVE-2026-109619. CVE es el identificador público de una vulnerabilidad. Esquema simplificado.</p>"}, {"id": "ia", "label": "El papel de la IA", "title": "Investigar más rápido.<br><em>Validar sigue siendo vital.</em>", "body": "<div class=\"grid three\"><article class=\"card\"><span class=\"num\">01</span><h3>Analizar</h3><p>La IA ayudó a explorar fallos y encadenar condiciones complejas.</p></article><article class=\"card\"><span class=\"num\">02</span><h3>Comprobar</h3><p>Los investigadores probaron y adaptaron demostraciones de explotación.</p></article><article class=\"card\"><span class=\"num\">03</span><h3>Corregir</h3><p>El equipo de PHP revisó y publicó las correcciones.</p></article></div><div class=\"callout\">Había señales de uno de los problemas desde 2024. En 2026 se demostró su impacto práctico.</div><p class=\"caption\">Trabajo coordinado de PHP, Calif, OpenAI y Wiz, entre otros. Las decisiones y los parches requieren revisión humana.</p>"}, {"id": "alcance", "label": "Leer bien el titular", "title": "Vulnerable <em>≠ atacada.</em>", "body": "<div class=\"scale\"><strong>Muchas webs comparten PHP.</strong><span>Pero su exposición depende de la versión y del entorno.</span></div><div class=\"grid three\"><details><summary>Vulnerabilidad <span>＋</span></summary><p>Existe una debilidad que puede aprovecharse. No demuestra que alguien ya lo haya hecho.</p></details><details><summary>Explotación <span>＋</span></summary><p>Alguien consigue aprovechar el fallo. Una prueba de laboratorio demuestra posibilidad, no el número de víctimas reales.</p></details><details><summary>Impacto <span>＋</span></summary><p>Hay que investigar qué ocurrió: acceso a datos, cambios en la web o interrupción del servicio.</p></details></div><p class=\"prompt\">«Millones de webs en riesgo» no significa «millones de webs hackeadas».</p>"}, {"id": "respuesta", "label": "Qué debe hacer una empresa", "title": "Actualizar <em>la capa correcta.</em>", "body": "<div class=\"split\"><div class=\"stack\"><span>Contenido y diseño</span><span>WordPress y extensiones</span><strong>PHP ← corrección del caso</strong><span>Servidor / alojamiento</span></div><div><p class=\"lead\">Actualizar un plugin no garantiza que se haya actualizado PHP.</p><p>Pregunta al proveedor de alojamiento si usa una versión afectada y si ya ha aplicado el parche.</p><details><summary>Versiones publicadas el 21/10/2026 <span>＋</span></summary><p>PHP 8.5.12 · 8.4.27 · 8.3.36 · 8.2.35. Son las correcciones de esa fecha, no una lista permanente de versiones más recientes. El proveedor puede distribuir el parche en su propio paquete.</p></details></div></div><p class=\"caption\">Después: comprobar el funcionamiento y revisar con el equipo técnico posibles indicios de compromiso. Un parche no deshace por sí solo un ataque anterior.</p>"}, {"id": "decision", "label": "Simulación · Tienda ficticia", "title": "La tienda sigue abierta.<br><em>¿Tu primer mensaje?</em>", "body": "<p class=\"lead\">Llevas el marketing de una tienda con WordPress. Aparece la alerta sobre PHP2Shell.</p><div class=\"decisions\"><button data-decision=\"0\">«Se ve bien. Seguimos como siempre».</button><button data-decision=\"1\">«Hosting: confirmad versión de PHP y aplicación del parche».</button><button data-decision=\"2\">«He cambiado la contraseña; problema resuelto».</button></div><div class=\"feedback\" role=\"status\">Elige una acción para ver qué resuelve y qué deja pendiente.</div>"}, {"id": "fuentes", "label": "Fuentes · 22/10/2026", "title": "Del titular <em>a la evidencia.</em>", "body": "<a class=\"source\" href=\"https://thephp.foundation/blog/2026/10/21/todays-php-security-release-and-how-were-strengthening-php-security/\" target=\"_blank\" rel=\"noopener\"><span>PHP Foundation · Comunicado oficial<small>Cronología, papel de la IA y versiones corregidas · 21/10/2026</small></span><b aria-hidden=\"true\">↗</b></a><a class=\"source\" href=\"https://www.wiz.io/blog/php2shell-php-rce\" target=\"_blank\" rel=\"noopener\"><span>Wiz Research · Investigación PHP2Shell<small>Impacto técnico y demostraciones en aplicaciones · 21/10/2026</small></span><b aria-hidden=\"true\">↗</b></a><a class=\"source\" href=\"https://www.php.net/\" target=\"_blank\" rel=\"noopener\"><span>PHP · Publicaciones oficiales<small>Comprobar versiones e instrucciones de actualización</small></span><b aria-hidden=\"true\">↗</b></a><div class=\"callout\">La seguridad de una web incluye sus dependencias y a quienes las mantienen.</div><p class=\"caption\">Material didáctico de MD / U02. La simulación no conecta con ningún servidor real ni ejecuta ataques.</p>"}];const stage=document.querySelector('main'),menu=document.querySelector('select');let index=0;const states={};menu.innerHTML=pages.map((p,i)=>`<option value="${i}">${i+1} · ${p.label}</option>`).join('');
const flows={ca:[['Una persona hace el test','La app pide conectar su cuenta de Facebook y obtiene información.'],['El alcance se amplía','La antigua API —la conexión entre programas— permitía acceder a ciertos datos de amigos que no habían usado la app.'],['Se construyen perfiles','La información sirve para inferir características de las personas y agruparlas.'],['Se orientan mensajes políticos','Cambridge Analytica utiliza perfiles para seleccionar públicos. La FTC concluyó que hubo prácticas engañosas en la obtención de datos.']],php:[['Tú pides una página','Por ejemplo, abres el catálogo de una tienda desde el móvil.'],['El servidor prepara el contenido','PHP ejecuta instrucciones y puede consultar productos en una base de datos.'],['El navegador muestra el resultado','Recibes una página que puedes ver e interactuar con ella. Esquema didáctico simplificado.']]};
function draw(){let p=pages[index];stage.innerHTML=`<section aria-labelledby="heading"><div class="eyebrow">${String(index+1).padStart(2,'0')} / ${p.label}</div><h1 id="heading">${p.title}</h1>${p.body}</section>`;menu.value=index;document.querySelector('#count').textContent=`${index+1} / ${pages.length}`;document.querySelector('#prev').disabled=!index;document.querySelector('#next').disabled=index===pages.length-1;document.querySelector('.progress i').style.width=(index+1)/pages.length*100+'%';
let flow=stage.querySelector('[data-flow]');if(flow){let key=flow.dataset.flow;const show=n=>{states[p.id]=n;flow.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',i===n));let f=flows[key][n];stage.querySelector('.flow-panel').innerHTML=`<h3>${f[0]}</h3><p>${f[1]}</p>`};flow.querySelectorAll('button').forEach(b=>b.onclick=()=>show(+b.dataset.step));show(states[p.id]||0)}
stage.querySelectorAll('details').forEach((d,i)=>{d.open=!!states[p.id+'detail'+i];d.ontoggle=()=>states[p.id+'detail'+i]=d.open});
function opinion(v){states.opinion=v;stage.querySelectorAll('[data-opinion]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.opinion===v));stage.querySelector('.choice').textContent='Tu postura: '+v+'. ¿Qué argumento la sostiene?'}stage.querySelectorAll('[data-opinion]').forEach(b=>b.onclick=()=>opinion(b.dataset.opinion));if(p.id==='debate'&&states.opinion)opinion(states.opinion);
function decision(n){states.decision=n;stage.querySelectorAll('[data-decision]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.decision===n));stage.querySelector('.feedback').textContent=['Que la tienda funcione no descarta una vulnerabilidad. Primero necesitas confirmar su situación técnica.','Buena primera acción: confirmar exposición y corrección con quien administra PHP. Después hay que verificar el servicio y revisar indicios de incidentes.','Cambiar una contraseña no corrige un fallo del motor PHP. La prioridad es confirmar la actualización; otras medidas dependerán de lo investigado.'][n]}stage.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>decision(+b.dataset.decision));if(p.id==='decision'&&states.decision!==undefined)decision(states.decision);}
function go(n){index=Math.max(0,Math.min(pages.length-1,n));history.replaceState(null,'','#'+pages[index].id);draw();window.scrollTo(0,0)}document.querySelector('#prev').onclick=()=>go(index-1);document.querySelector('#next').onclick=()=>go(index+1);menu.onchange=()=>go(+menu.value);document.querySelector('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.querySelector('#count').textContent='Abre la URL en otra pestaña para ampliar.'}};document.addEventListener('keydown',e=>{if(['BUTTON','SELECT','SUMMARY','INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}});window.addEventListener('hashchange',()=>{let n=pages.findIndex(p=>p.id===location.hash.slice(1));if(n>=0){index=n;draw()}});let initial=pages.findIndex(p=>p.id===location.hash.slice(1));if(initial>=0)index=initial;draw();</script></body></html>
