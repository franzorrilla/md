<script>
(()=>{'use strict';
const KEY='mision404_acto1_prototipo_v2';
const TEAMS={ALFA:{icon:'◉',label:'Comunicaciones',short:'A',intro:'Controlas la colaboración con la agencia y la comunicación del lanzamiento.',secret:'El enlace DR-17 se envió por error en un correo destinado a Estudio Cobalto.',share:'A-DR17',source:'A-03',question:'¿Cómo garantizarías el trabajo de la agencia sin exponer material interno?',answers:['Dar acceso de edición a toda la carpeta del lanzamiento.','Crear una carpeta separada con los materiales autorizados y acceso solo a las personas necesarias.','Desactivar la colaboración con proveedores durante toda la campaña.'],correct:1,terms:['acceso','material','permiso','carpeta','proveedor'],docs:[{id:'A-01',type:'CORREO',title:'Solicitud de Estudio Cobalto',time:'08:42',body:`<div class="mini-logo">Correo interno</div><h3>Re: Materiales pendientes para el lanzamiento</h3><p><strong>De:</strong> Marta — Estudio Cobalto<br><strong>Para:</strong> marketing@limonlab.example</p><p>Las fotografías de producto se abren correctamente. Hemos recibido también un enlace a una carpeta de lanzamiento, aunque solo necesitamos los creativos finales.</p><p>¿Podéis mantener el acceso a las imágenes hasta las 14:00? Terminaremos las adaptaciones a tiempo.</p><p>Gracias, Marta.</p>`},{id:'A-02',type:'CALENDARIO',title:'Compromisos de campaña',time:'08:50',body:`<div class="mini-logo">Marketing / agenda</div><h3>Proyecto Cero · Calendario</h3><table><tr><th>Actividad</th><th>Hora</th><th>Dependencia</th></tr><tr><td>Creatividades finales</td><td>12:00</td><td>Estudio Cobalto</td></tr><tr><td>Revisión comercial</td><td>13:30</td><td>Marketing</td></tr><tr><td>Lanzamiento</td><td>14:17</td><td>PulseFlow</td></tr></table><p>Una paralización total impediría cumplir los plazos de la agencia.</p>`},{id:'A-03',type:'HISTORIAL',title:'Registro de enlaces enviados',time:'09:09',body:`<div class="mini-logo">Registro de enlaces</div><h3>Comparticiones recientes</h3><table><tr><th>Referencia</th><th>Destino</th><th>Contenido descrito</th></tr><tr><td>FOTOS-PR</td><td>Agencia</td><td>Imágenes de prensa</td></tr><tr><td>DR-17</td><td>Agencia</td><td>Materiales de lanzamiento</td></tr></table><p><strong>Nota:</strong> la agencia solo había solicitado fotografías y copys aprobados. El contenido exacto de DR-17 no figura aquí.</p>`}]},BRAVO:{icon:'⌁',label:'Infraestructura',short:'B',intro:'Controlas permisos, carpetas compartidas y cuentas corporativas.',secret:'La carpeta DR-17 permite acceso con enlace a sus archivos, incluida una exportación CSV.',share:'B-PERMISOS',source:'B-01',question:'¿Qué medida reduce el riesgo de DR-17 sin bloquear toda la infraestructura?',answers:['Cerrar Google Drive a todos los usuarios durante 24 horas.','No hacer cambios hasta confirmar que alguien descargó los documentos.','Restringir DR-17 y revisar las personas autorizadas, manteniendo los accesos legítimos.'],correct:2,terms:['permiso','acceso','carpeta','restring','usuario'],docs:[{id:'B-01',type:'PERMISOS',title:'Auditoría de Google Drive',time:'09:12',body:`<div class="mini-logo">Drive / auditoría</div><h3>Resumen de permisos</h3><table><tr><th>Recurso</th><th>Compartición</th></tr><tr><td>Fotografías de prensa</td><td>Cualquiera con enlace · lector</td></tr><tr><td><strong>DR-17</strong></td><td><strong>Cualquiera con enlace · lector</strong></td></tr><tr><td>Contratos de proveedores</td><td>Usuarios autorizados · lector</td></tr><tr><td>BRF-22</td><td>Equipo interno · editor</td></tr></table><p>El acceso abierto a una carpeta puede dar acceso a los archivos que contiene según sus permisos.</p>`},{id:'B-02',type:'REGISTRO',title:'Actividad reciente',time:'09:13',body:`<div class="mini-logo">Sistema de monitorización</div><h3>Últimas señales</h3><table><tr><th>Hora</th><th>Evento</th></tr><tr><td>08:35</td><td>Inicio de sesión legítimo de Marketing</td></tr><tr><td>08:51</td><td>Consulta de un enlace compartido de prensa</td></tr><tr><td>09:05</td><td>Acceso a la carpeta DR-17 mediante enlace</td></tr></table><p><s function renderPersonal(){const code=actor.code,p=ROLE_PROMPTS[code],u=me();return `${title('Mensaje reservado','Información exclusiva para tu puesto. Primero registra tu interpretación individual; después podrás contrastarla con tu equipo.')}
<div class="card"><div class="cardheader"><div><div class="smallcaps">CONFIDENCIAL / ${code}</div><h3 style="margin-top:9px">Responsable de ${ROLE_NAMES[Number(code.slice(-1))-1]}</h3></div><div class="glyph">${actor.code.slice(-1)}</div></div><p>${TEAMS[actor.team].intro}</p><div class="card" style="margin:18px 0;padding:18px;border:1px solid #34546b;background:#13283a"><div class="smallcaps">INFORMACIÓN DE INCORPORACIÓN</div><h3 style="margin:8px 0 12px;font-size:17px">${TEAM_BRIEFINGS[actor.team].heading}</h3><p style="margin-bottom:10px">${TEAM_BRIEFINGS[actor.team].intro}</p><p class="micro" style="margin:0">${TEAM_BRIEFINGS[actor.team].detail}</p></div><div class="smallcaps" style="margin-top:18px">TU PRIMERA DECISIÓN</div><div class="context">${esc(p.q)}</div>
${u.individual?`<div class="success"><strong>Respuesta registrada.</strong> Tu primera decisión está guardada en este navegador. Puedes compartir ahora tus conclusiones con el equipo.</div><p class="micro">Elección registrada: ${esc(p.choices[+u.individual.choice]||'—')}</p><div class="dock"><button class="button secondary sm" data-action="view" data-view="docs">Ver expediente →</button></div>`:`<form id="individual-form"><fieldset>${p.choices.map((a,i)=>`<label class="option"><input type="radio" name="individual-choice" value="${i}" required><span>${esc(a)}</span></label>`).join('')}</fieldset><label for="individual-reason" class="label">Justifica tu decisión (mínimo 25 caracteres)</label><textarea id="individual-reason" placeholder="Explica qué problema resuelve y qué riesgo evita…" required minlength="25"></textarea><div class="dock"><button type="submit" class="button">Registrar decisión personal →</button></div></form>`}</div>`};
function renderDocs(){const d=TEAMS[actor.team],td=team(actor.team);if(openedDoc){const doc=d.docs.find(x=>x.id===openedDoc);return `${title('Expediente '+doc.id,'Pieza de evidencia · '+doc.type+' · '+doc.time)}<div class="dock"><button class="button secondary sm" data-action="close-doc">← Volver al expediente</button><span class="pill">${doc.type} · ${doc.time}</span></div><div class="paper">${doc.body}<div class="divider" style="background:#d4dde1"></div><div class="paperid">Documento ${doc.id} · material ficticio para la simulación</div></div><div class="dock"><button class="button" data-action="mark-doc" data-doc="${doc.id}">${(td.readDocs||[]).includes(doc.id)?'Documento revisado ✓':'Registrar documento revisado'}</button></div>`}
return `${title('Expediente '+actor.team,'Investiga tres documentos ficticios. No todas las anomalías indican un ataque. Las fuentes documentales serán útiles para justificar decisiones.')}
<div class="grid2">${d.docs.map((doc,i)=>`<button class="card interactive" data-action="open-doc" data-doc="${doc.id}" style="text-align:left;color:inherit"><div class="cardheader"><div class="glyph">${['▤','⌁','◇'][i]}</div><span class="tag">${(td.readDocs||[]).includes(doc.id)?'Revisado ✓':'Por revisar'}</span></div><div class="docmeta">${doc.id} / ${doc.type} / ${doc.time}</div><h3 style="margin-top:10px">${doc.title}</h3><p>Abrir documento y revisar evidencia →</p></button>`).join('')}</div>
<div class="callout" style="margin-top:18px"><strong>Consejo de investigación</strong><p style="margin:8px 0 0;color:inherit">Anota las referencias de los documentos. Una afirmación de otro equipo no equivale por sí sola a evidencia confirmada.</p></div>`};
function renderConnect(){const td=team(actor.team),unlocked=isAvailable(26);return `${title('Cruce de información','Cuatro células investigan una misma infraestructura. Algunas referencias solo adquieren sentido cuando se contrastan.')}
<div class="grid2"><div class="card"><div class="smallcaps">Tu credencial de intercambio</div><h3 style="margin-top:10px">Pista verificable de ${actor.team}</h3><div class="codebox">${TEAMS[actor.team].share}</div><p style="margin:14px 0 0">${TEAMS[actor.team].secret}</p><div class="divider"></div><p class="micro">Puedes comunicar verbalmente esta clave y la fuente ${TEAMS[actor.team].source} a otro equipo. No revela automáticamente toda su documentación.</p></div><div class="card"><div class="smallcaps">Mesa de cooperación</div><h3 style="margin-top:10px">Verificar una pista ajena</h3>${!unlocked?`<div class="warning">Este canal se activa al minuto 26 de misión. Faltan ${26-min()} minutos.</div>`:`<p>Habla con otra célula y solicita su clave de intercambio. Regístrala aquí para incorporar la evidencia a tu expediente.</p><form id="exchange-form"><label class="label" for="exchange-code">Clave comunicada por otra célula</label><input id="exchange-code" type="text" placeholder="Ej. B-PERMISOS" required/><div class="dock"><button class="button" type="submit">Validar fuente →</button></div></form>`}</div></div>
<div class="card" style="margin-top:16px"><div class="smallcaps">Fuentes contrastadas (${(td.contacts||[]).length})</div>${(td.contacts||[]).length?td.contacts.map(x=>`<div class="stepbox"><span class="stepno done">✓</span><div><strong>${esc(x.team)}</strong><p>${esc(TEAMS[x.team].secret)}<br>Documento de referencia: ${TEAMS[x.team].source}</p></div></div>`).join(''):'<p style="margin:12px 0 0">Todavía no has registrado información de otras células.</p>'}</div>`};
function renderDecision(){const td=team(actor.team),t=TEAMS[actor.team],ok=isAvailable(36),sourceList=[...t.docs.map(d=>({value:d.id,label:d.id+' · '+d.title})),...(td.contacts||[]).map(x=>({value:TEAMS[x.team].source+'@'+x.team,label:TEAMS[x.team].source+' · Información contrastada con '+x.team}))];return `${title('Decisión operativa','Elige una actuación concreta. Una medida de seguridad también puede afectar a la continuidad comercial. Justifica con evidencias.')}
<div class="card"><div class="smallcaps">DECISIÓN ${t.short}-01 · ${t.label.toUpperCase()}</div><h3 style="margin-top:13px">${esc(t.question)}</h3>
${td.decision?`<div class="success">Decisión de equipo registrada. Se conservará para calcular consecuencias en los siguientes actos.</div><p><strong>Actuación:</strong> ${esc(t.answers[+td.decision.choice])}</p><p><strong>Justificación:</strong> ${esc(td.decision.reason)}</p><p class="micro">Fuentes: ${esc(td.decision.sources.join(', '))}</p><button class="button secondary sm" data-action="view" data-view="auth">Continuar a autorización →</button>`:
!ok?`<div class="warning">La consola de decisiones se habilita al minuto 36. Faltan ${36-min()} minutos. Revisa documentos y contrasta tus hipótesis mientras tanto.</div>`:
`<form id="decision-form"><fieldset>${t.answers.map((a,i)=>`<label class="option"><input name="team-choice" type="radio" value="${i}" required><span>${esc(a)}</span></label>`).join('')}</fieldset><div class="divider"></div><label class="label" for="decision-sources">Selecciona hasta tres evidencias que respaldan tu decisión</label><div style="display:grid;gap:9px;margin-bottom:20px">${sourceList.map(s=>`<label style="font-size:13px;display:flex;gap:9px;align-items:center"><input type="checkbox" name="sources" value="${esc(s.value)}" style="accent-color:#68e5d2">${esc(s.label)}</label>`).join('')}</div><label class="label" for="team-reason">Justificación del equipo (mínimo 60 caracteres)</label><textarea required minlength="60" id="team-reason" placeholder="Qué riesgo mitigáis, qué evidencia lo sostiene y qué consecuencia puede tener vuestra medida…"></textarea><div class="dock"><button class="button" type="submit">Registrar decisión →</button></div></form>`}</div>`};
function renderAuth(){const td=team(actor.team),allowed=isAvailable(46);return `${title('Autorización 404','El Director del Protocolo 404 debe validar presencialmente el diagnóstico antes de liberar información restringida.')}
<div class="card"><div class="cardheader"><div><div class="scene-label">ACCESO RESTRINGIDO · NIVEL 3</div><h3 style="margin-top:12px">Informe forense 02</h3></div><div class="glyph">⌑</div></div><p>Presentad al director tres elementos: un riesgo acreditado, una decisión proporcionada y la diferencia entre hechos comprobados e hipótesis.</p>
${!allowed?`<div class="warning">La ventana de autorización se abre al minuto 46. Faltan ${46-min()} minutos de misión.</div>`:!td.decision?`<div class="warning">Antes debes registrar la decisión operativa de la célula.</div>`:td.authorized?`<div class="success"><strong>Autorización concedida.</strong> La célula ${actor.team} tiene acceso validado. El informe no se publicará antes del minuto 80.</div>`:`<form id="auth-form"><div class="field"><label class="label" for="auth-code">Código recibido del director (presencialmente)</label><input id="auth-code" type="text" placeholder="Autorización 404" required autocomplete="off" spellcheck="false"/></div><button type="submit" class="button">Validar autorización →</button></form><p class="micro">En esta demostración puedes consultar el código en el panel docente de prueba. La versión definitiva lo verificará en el servidor.</p>`}
<div class="divider"></div><div class="smallcaps">Estado del análisis forense</div><div class="timerbox" style="margin-top:12px"><div class="timerbig">${min()<60?'—':min()<80?String(80-min()).padStart(2,'0')+':00':'DISPONIBLE'}</div><div class="micro">${min()<60?'El análisis comienza tras la alerta del minuto 60.':min()<80?'Tiempo aproximado hasta la liberación del informe':'Ventana de publicación activada'}</div></div>
${min()>=80&&td.authorized?`<div class="callout" style="margin-top:16px"><strong>INFORME DESBLOQUEADO · FIN DEL ACTO I</strong><p style="margin:9px 0 0;color:inherit">Se ha detectado actividad inusual de una cuenta corporativa. La identidad del usuario todavía no está confirmada. La investigación continúa en el Acto II.</p></div>`:''}</div>`};
function renderResults(){const t=team(actor.team),g=gradeTeam(actor.team),i=gradeIndividual(actor.code);return `${title('Informe de la célula','Resumen de evidencias y calificación provisional del prototipo. Los comentarios de evaluación se reservarán para la vista docente en la aplicación final.')}
<div class="grid2"><div class="card"><div class="smallcaps">Célula ${actor.team}</div><h3 style="margin-top:12px">Trabajo colectivo</h3><div class="timerbig">${g?g.note.toFixed(1):'—'}<span style="font-size:16px;color:#a4bdcb"> / 10</span></div><p class="micro">${g?'Estimación automática provisional.':'Pendiente de decisión operativa.'}</p></div><div class="card"><div class="smallcaps">Operador ${actor.code}</div><h3 style="margin-top:12px">Primera misión individual</h3><div class="timerbig">${i?i.note.toFixed(1):'—'}<span style="font-size:16px;color:#a4bdcb"> / 10</span></div><p class="micro">${i?'Estimación automática provisional.':'Pendiente de respuesta individual.'}</p></div></div><div class="callout" style="margin-top:16px">Esta versión calcula una puntuación orientativa para probar el flujo. La calidad real de las justificaciones debe revisarse antes de asignar calificaciones académicas definitivas.</div><div class="dock"><button class="button secondary" data-action="teacher">Consultar vista docente →</button></div>`};
function renderTeacher(){const teams=Object.keys(TEAMS),numUsers=Object.values(state.users).filter(x=>x.individual).length;const groupRows=teams.map(t=>{const g=gradeTeam(t),d=team(t);return `<tr><td><strong>${t}</strong></td><td>${d.decision?'Registrada':'Pendiente'}</td><td>${d.authorized?'Concedida':'Pendiente'}</td><td>${g?`<span class="grade">${g.note.toFixed(1)}</span>`:'—'}</td><td>${esc(g?.comment||'Sin evidencias suficientes.')}</td></tr>`}).join('');const userRows=teams.flatMap(t=>students(t)).map(c=>{const g=gradeIndividual(c),u=state.users[c];return `<tr><td>${c}</td><td>${TEAMS[Object.keys(TEAMS).find(t=>t[0]===c[0])].label}</td><td>${ROLE_NAMES[Number(c.slice(-1))-1]}</td><td>${g?`<span class="grade">${g.note.toFixed(1)}</span>`:'—'}</td><td>${esc(g?.comment||'Sin respuesta individual.')}</td></tr>`}).join('');return `<section>${title('Centro de dirección · Demostración','Control de tiempos, autorizaciones y vista provisional de calificaciones. Este panel no tiene autenticación real y no debe utilizarse todavía con alumnado.')}
<div class="screenintro"><div class="smallcaps">ESTADO DEL PROTOTIPO</div><h2 style="margin:9px 0">${fmt(state.elapsed)} <span style="color:#92afc2;font-size:17px">/ 01:20</span></h2><div class="dock"><span class="pill">${state.running?'Reloj activo':'Reloj pausado'}</span><span class="pill">${numUsers}/12 respuestas individuales</span><span class="pill">${teams.filter(t=>!!team(t).decision).length}/4 decisiones de equipo</span></div><div class="hbuttons"><button class="button sm" data-action="toggle">${state.running?'Pausar':'Reanudar'} reloj</button><button class="button secondary sm" data-action="advance" data-minutes="10">+ 10 min</button><button class="button secondary sm" data-action="advance" data-minutes="1">+ 1 min</button><button class="button ghost sm" data-action="advance" data-minutes="20">+ 20 min</button></div><p class="micro">El tiempo se acelera manualmente para verificar los desbloqueos. La versión real utilizará reloj de servidor y pausas docentes.</p></div>
<div class="grid2" style="margin-top:18px"><div class="card"><div class="smallcaps">Hitos de misión</div>${[[0,'Inicio'],[26,'Colaboración'],[36,'Decisión de equipo'],[46,'Autorización docente'],[60,'Alerta de seguridad'],[80,'Informe forense']].map(([m,s])=>`<div class="stepbox"><div class="stepno ${min()>=m?'done':''}">${min()>=m?'✓':'○'}</div><div><strong>${m} min · ${s}</strong></div></div>`).join('')}</div><div class="card"><div class="smallcaps">Autorizaciones de demostración</div><h3 style="margin-top:9px">Claves por célula</h3>${teams.map(t=>`<div class="stepbox"><div style="flex:1"><strong>${t}</strong><div class="mono" style="color:var(--accent);font-size:18px">404-${t}</div></div><span class="micro">${team(t).authorized?'Usada ✓':'Sin usar'}</span></div>`).join('')}<p class="micro">No son credenciales seguras. Sustituiremos estas claves visibles por códigos únicos emitidos y comprobados en Apps Script.</p></div></div>
<div class="card" style="margin-top:18px"><div class="cardheader"><div><div class="smallcaps">SIMULACIÓN DE HDC</div><h3 style="margin-top:8px">Evaluación de equipos</h3></div><button class="button secondary sm" data-action="export-groups">Exportar CSV</button></div><div class="tablewrap"><table class="teacher-table"><thead><tr><th>Equipo</th><th>Decisión</th><th>Autorización</th><th>Nota /10*</th><th>Comentario breve</th></tr></thead><tbody>${groupRows}</tbody></table></div></div>
<div class="card" style="margin-top:18px"><div class="cardheader"><div><div class="smallcaps">SIMULACIÓN DE HDC</div><h3 style="margin-top:8px">Evaluación individual</h3></div><button class="button secondary sm" data-action="export-users">Exportar CSV</button></div><div class="tablewrap"><table class="teacher-table"><thead><tr><th>Operador</th><th>Célula</th><th>Rol</th><th>Nota /10*</th><th>Comentario breve</th></tr></thead><tbody>${userRows}</tbody></table></div></div>
<p class="micro" style="margin-top:12px">*Puntuaciones aproximadas para verificar la interfaz. Las respuestas abiertas no están corregidas semánticamente. La nota final del reto solo se calculará cuando estén implementados los cinco actos y la rúbrica revisable.</p>
<div class="dock"><button class="button secondary" data-action="return">Volver al operador</button><button class="button alert sm" data-action="reset">Restablecer todos los datos de prueba</button></div></section>`};
function csv(rows,name){const txt='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8;'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)};
function exportGroups(){csv([['Equipo','Decisión registrada','Autorización','Nota provisional /10','Comentario breve'],...Object.keys(TEAMS).map(t=>{const g=gradeTeam(t);return[t,team(t).decision?'Sí':'No',team(t).authorized?'Sí':'No',g?.note??'',g?.comment??'Pendiente']})],'mision404-equipos-demo.csv')};
function exportUsers(){csv([['Código','Equipo','Rol','Nota provisional /10','Comentario breve'],...Object.keys(TEAMS).flatMap(t=>students(t).map(c=>{const g=gradeIndividual(c);return[c,t,ROLE_NAMES[+c.slice(-1)-1],g?.note??'',g?.comment??'Pendiente']}))],'mision404-alumnos-demo.csv')};
function action(a,el){if(a==='teacher'){teacher=true;render();return}if(a==='return'){teacher=false;render();return}if(a==='logout'){actor=null;teacher=false;view='home';render();return}if(a==='view'){view=el.dataset.view;openedDoc=null;render();window.scrollTo({top:0,behavior:'smooth'});return}if(a==='open-doc'){openedDoc=el.dataset.doc;render();return}if(a==='close-doc'){openedDoc=null;render();return}if(a==='mark-doc'){const td=team(actor.team);td.readDocs??=[];if(!td.readDocs.includes(el.dataset.doc))td.readDocs.push(el.dataset.doc);log('document','Revisión de '+el.dataset.doc,actor.team,actor.code);openedDoc=null;say('Documento incorporado al expediente.');return}if(a==='toggle'){state.running=!state.running;save();render();return}if(a==='advance'){state.elapsed=Math.min(5*3600,state.elapsed+Number(el.dataset.minutes)*60);save();render();return}if(a==='reset'){if(confirm('¿Borrar todos los datos y reiniciar el prototipo?')){state=fresh();actor=null;teacher=false;view='home';save();render()}return}if(a==='export-groups'){exportGroups();return}if(a==='export-users'){exportUsers();return}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)action(el.dataset.action,el)});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;if(id==='login-form'){const t=document.getElementById('team-input').value;const code=document.getElementById('student-input').value.trim().toUpperCase();if(!students(t).includes(code))return say('El código no corresponde al equipo elegido. Prueba '+t[0]+'01, '+t[0]+'02 o '+t[0]+'03.','error');actor={team:t,code};state.users[code]??={};team(t);if(!state.running)state.running=true;save();view='home';log('login','Acceso de operador',t,code);render();return}
if(id==='individual-form'){const c=e.target.querySelector('[name="individual-choice"]:checked');const reason=document.getElementById('individual-reason').value.trim();if(!c||reason.length<25)return say('Elige una respuesta y escribe una justificación de al menos 25 caracteres.','error');state.users[actor.code].individual={choice:c.value,reason,at:state.elapsed};log('individual','Misión personal entregada',actor.team,actor.code);say('Decisión individual registrada. Ahora puedes compartir lo que has aprendido.');return}
if(id==='exchange-form'){const code=document.getElementById('exchange-code').value.trim().toUpperCase();const other=Object.keys(TEAMS).find(t=>TEAMS[t].share===code);if(!other)return say('No se ha reconocido la clave. Consulta la fuente con el otro equipo.','error');if(other===actor.team)return say('Debes consultar a otra célula para contrastar nueva información.','error');const td=team(actor.team);td.contacts??=[];if(td.contacts.some(x=>x.team===other))return say('Ya habías incorporado esta información.','error');td.contacts.push({team:other,at:state.elapsed});log('cooperacion','Fuente compartida por '+other,actor.team,actor.code);say('Pista contrastada e incorporada al expediente.');return}
if(id==='decision-form'){const c=e.target.querySelector('[name="team-choice"]:checked');const sources=[...e.target.querySelectorAll('[name="sources"]:checked')].map(x=>x.value);const reason=document.getElementById('team-reason').value.trim();if(!c||reason.length<60||sources.length<1||sources.length>3)return say('Elige una actuación, marca de una a tres evidencias y justifica con al menos 60 caracteres.','error');const td=team(actor.team);td.decision={choice:c.value,sources,reason,at:state.elapsed,author:actor.code};log('decision','Decisión operativa registrada',actor.team,actor.code);say('Decisión de célula registrada. Las consecuencias aparecerán en los próximos actos.');return}
if(id==='auth-form'){const code=document.getElementById('auth-code').value.trim().toUpperCase();if(code!=='404-'+actor.team)return say('Código incorrecto para esta célula. Verificadlo presencialmente con la dirección.','error');team(actor.team).authorized={at:state.elapsed,by:actor.code};log('autorizacion','Autorización del director validada',actor.team,actor.code);say('Acceso autorizado. El informe se liberará a partir del minuto 80.');return}
});
setInterval(()=>{if(state.running){state.elapsed+=1;save();const el=document.getElementById('top-clock');if(el)el.textContent=fmt(state.elapsed);if(state.elapsed%60===0)render()}},1000);
render();
})();
</script>
</body>
</html>
