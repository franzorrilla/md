/* Narrative briefing, shown before sign-in and available inside the mission */
.briefing-shell{padding-top:24px}
.briefing-hero{min-height:320px;border:1px solid #3a5e68;border-radius:22px;background:radial-gradient(ellipse at 78% 45%,#214756 0%,transparent 35%),linear-gradient(125deg,#101a2c 0%,#0b2938 65%,#0e1727 100%);display:flex;justify-content:space-between;align-items:center;gap:26px;position:relative;overflow:hidden;padding:34px 44px;margin-bottom:20px}
.briefing-hero:before{content:'404';position:absolute;right:12%;top:-45px;color:#e5fffa06;font:800 clamp(150px,23vw,340px) 'Space Grotesk';letter-spacing:-.13em;pointer-events:none}
.briefing-hero-copy{position:relative;z-index:1;max-width:720px}
.brief-brand{font:700 12px 'Space Grotesk';letter-spacing:.22em;color:#82ccb9;margin:24px 0 13px}
.briefing-hero h1{font-size:clamp(43px,5.3vw,76px);line-height:.98;margin:0 0 19px}
.brief-lead{font:500 clamp(17px,2vw,21px)/1.42 'Space Grotesk';max-width:620px;color:#d2e4ee;margin-bottom:18px}
.brief-stats{display:flex;gap:10px;flex-wrap:wrap}
.brief-stats span{font:700 11px 'Space Grotesk';text-transform:uppercase;letter-spacing:.07em;border:1px solid #4e6a78;background:#193646;padding:7px 12px;border-radius:999px;color:#bde0e6}
.brief-can-wrap{width:220px;height:260px;flex:none;display:grid;place-items:center;position:relative}
.brief-orbit{position:absolute;width:205px;height:205px;border-radius:50%;border:1px solid #8af8d83b;box-shadow:0 0 0 22px #70d9b00a,0 0 0 50px #70d9b009}
.brief-can{height:215px;width:117px;border:2px solid #d9faef;border-radius:28px 28px 23px 23px;background:linear-gradient(105deg,#bfd2d0 0%,#f0fff9 14%,#bedbd5 27%,#86b8b0 59%,#335c68 95%);box-shadow:-17px 15px 38px #0009,10px 0 20px #b0ffee1d,inset 6px 0 14px #fff6;transform:rotate(-13deg);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#0d4240;position:relative}
.brief-can:before{content:'';position:absolute;top:5px;left:15px;right:15px;height:6px;background:#7aa29a;border-radius:50%;border:1px solid #ceded8}
.brief-can-crest{font:800 12px 'Space Grotesk';letter-spacing:.13em}
.brief-can-zero{font:800 35px 'Space Grotesk';letter-spacing:-.06em;margin-top:6px}
.brief-can-fine{font:700 8px 'Space Grotesk';letter-spacing:.12em;margin-top:17px}
.brief-can-label{position:absolute;bottom:-10px;font:700 11px 'Space Grotesk';letter-spacing:.12em;color:#98d9d0;white-space:nowrap}
.briefing-grid{display:grid;grid-template-columns:minmax(0,1.42fr) minmax(285px,.8fr);gap:20px;align-items:start}
.briefing-reading{min-width:0}.briefing-access{position:sticky;top:20px;min-width:0}
.brief-dossier{border:1px solid #324c63;border-radius:18px;padding:26px 28px;background:linear-gradient(160deg,#132437,#0f1e2d);min-width:0}
.brief-dossier-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.brief-id{font:800 11px 'Space Grotesk';letter-spacing:.11em;color:#8de6d3}
.brief-class{font-size:11px;color:#91afbd}
.brief-dossier h2{font-size:clamp(23px,2.5vw,31px);margin-bottom:14px}
.brief-dossier>p{font-size:14px;line-height:1.65;margin-bottom:13px}
.brief-mission{background:#203a46;border:1px solid #4b7380;border-left:4px solid #68e5d2;border-radius:12px;display:flex;gap:14px;padding:16px;margin:21px 0}
.brief-symbol{font:800 21px 'Space Grotesk';display:grid;place-items:center;color:#062d31;background:#68e5d2;border-radius:50%;width:34px;height:34px;flex:none}
.brief-mission-title{font:700 15px 'Space Grotesk';color:#effaf8;margin-bottom:5px}
.brief-mission p{font-size:13px;margin:0;line-height:1.6}
.brief-sectiontitle{font:700 17px 'Space Grotesk';color:#ecf7f5;margin:24px 0 10px}
.brief-note{color:#a8c0ce;font-size:12px}
.brief-ecosystem{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.brief-tool{display:flex;gap:10px;border:1px solid #375167;background:#0d2234;border-radius:11px;padding:13px 11px}
.brief-tool-icon{height:31px;width:31px;border-radius:8px;background:#204653;color:#8fe5d9;flex:none;display:grid;place-items:center;font:700 10px 'Space Grotesk'}
.brief-tool strong{font-size:13px;display:block;line-height:1.35;margin-bottom:4px;color:#f2f8ff}
.brief-tool span{font-size:12px;color:#aac2d0;line-height:1.52;display:block}
.brief-flow{margin-top:12px;border:1px dashed #548491;border-radius:12px;padding:14px;background:#0b2733}
.flow-lead{display:block;text-transform:uppercase;font-size:10px;letter-spacing:.12em;font-weight:800;color:#91ddcb;margin-bottom:11px}
.flow-steps{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.flow-steps span{border:1px solid #457b78;border-radius:6px;padding:6px 9px;color:#e2f9f4;font-size:11px;background:#194249;font-weight:700}
.flow-steps b{color:#93cfc4}
.brief-flow p{font-size:12px;margin:11px 0 0;color:#bed0dc}
.brief-glossary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.brief-glossary>div{border:1px solid #355166;border-radius:10px;padding:12px}
.brief-glossary strong{color:#95f3dc;font:700 13px 'Space Grotesk'}
.brief-glossary p{font-size:12px;line-height:1.55;margin:5px 0 0}
.brief-cast{display:flex;gap:7px;flex-wrap:wrap}
.brief-cast span{background:#1e3447;border:1px solid #315167;border-radius:20px;padding:8px 11px;font-size:12px;color:#bed3df}
.brief-scope{margin-top:22px;border-top:1px solid #334e60;padding-top:16px;font-size:12px;line-height:1.75;color:#bdcfdb}
.brief-access-help{background:#112434;border:1px solid #354e60;border-radius:12px;padding:16px;margin-top:12px;font-size:13px;color:#b5c9d5;line-height:1.65}
.brief-access-help strong{color:#e9f7fb}
@media(max-width:1050px){.briefing-hero{padding:30px}.brief-can-wrap{width:170px}.briefing-grid{grid-template-columns:minmax(0,1fr) minmax(285px,.85fr)}}
@media(max-width:850px){.briefing-grid{grid-template-columns:1fr}.briefing-access{position:static}.brief-can-wrap{display:none}.briefing-hero{min-height:auto;padding:27px}.brief-dossier{padding:22px}}

.a2-wave{height:85px;display:flex;align-items:center;gap:5px;justify-content:center;margin:15px 0 18px;padding:4px 12px;background:#091b29;border:1px solid #315167;border-radius:12px}

.a2-audio-label{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.a2-audio-quote{font:500 clamp(17px,2vw,22px)/1.55 'Space Grotesk';color:#f2f9fc;margin:14px 0 10px;padding:0 0 0 17px;border-left:3px solid #7ce6d1}
.a2-stamp{font-size:11px;color:#94b7c9;letter-spacing:.11em;text-transform:uppercase}
.a2-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:16px 0}

.a2-proof strong{font-size:15px}
.a2-proof p{font-size:12px;margin:6px 0 0}
.a2-proof.locked{opacity:.68;border-style:dashed}
.a2-note{background:#102d35;border:1px solid #366e70;padding:14px;border-radius:12px;margin:15px 0;color:#cbe1e6;font-size:13px;line-height:1.65}
.a2-sequence{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:12px 0 20px}
.a2-sequence span{padding:7px 11px;border:1px solid #466073;border-radius:8px;font-size:12px;color:#cde1ed}
.a2-sequence span.done{color:#bdf9eb;border-color:#419785;background:#17483d}

tr><td>07:18</td><td>Inicio de sesión legítimo de Marketing</td></tr><tr><td>07:34</td><td>Consulta de un enlace compartido de prensa</td></tr><tr><td>07:48</td><td>Acceso a la carpeta DR-17 mediante enlace</td></tr></table><p><strong>Atención:</strong> el registro visible no confirma por sí mismo la identidad ni la intención del visitante.</p>`},{id:'B-03',type:'USUARIOS',title:'Mapa de accesos',time:'07:57',body:`<div class="mini-logo">Workspace / equipos</div><h3>Accesos corporativos</h3><table><tr><th>Área</th><th>Necesidad</th></tr><tr><td>Marketing</td><td>Gestionar materiales de campaña</td></tr><tr><td>Agencia</td><td>Consultar creatividades aprobadas</td></tr><tr><td>Clientes</td><td>Administrar el CRM</td></tr></table><p>El principio de mínimo privilegio recomienda conceder únicamente los accesos necesarios para la tarea.</p>`}]},CHARLIE:{icon:'◎',label:'Clientes',short:'C',intro:'Proteges los datos del CRM, las campañas segmentadas y la relación con clientes.',secret:'DR-17 contiene clientes_segmento_cero.csv con 1.480 registros y datos personales.',share:'C-CRM',source:'C-01',question:'¿Qué debería recibir la agencia para definir el público de una campaña?',answers:['Un resumen agregado y, solo si hace falta, los datos mínimos autorizados.','La base de datos completa para que pueda encontrar oportunidades.','Las contraseñas de acceso al CRM para que pueda elegir los datos.'],correct:0,terms:['dato','cliente','agregad','mínim','acceso'],docs:[{id:'C-01',type:'CRM',title:'Exportación de clientes',time:'07:53',body:`<div class="mini-logo">FaroCRM</div><h3>Proyecto Cero · Segmentación</h3><table><tr><th>Campo</th><th>Ejemplo ficticio</th></tr><tr><td>Nombre</td><td>Persona 001</td></tr><tr><td>Correo</td><td>cliente001@example.test</td></tr><tr><td>Teléfono</td><td>600 000 001</td></tr><tr><td>Compras</td><td>2 pedidos</td></tr><tr><td>Segmento</td><td>Prioritario</td></tr></table><p><strong>1.480 registros</strong> · Exportación <strong>clientes_segmento_cero.csv</strong> · Copia guardada en <strong>DR-17</strong>.</p>`},{id:'C-02',type:'DATOS',title:'Campos utilizados en la campaña',time:'07:53',body:`<div class="mini-logo">FaroCRM / configuración</div><h3>Preparación del envío</h3><table><tr><th>Dato</th><th>Uso previsto</th></tr><tr><td>Correo</td><td>Entrega del mensaje</td></tr><tr><td>Segmento</td><td>Personalización</td></tr><tr><td>Teléfono</td><td>No se utiliza en esta campaña</td></tr><tr><td>Compras anteriores</td><td>Analítica interna</td></tr></table><p>La agencia creativa solo debe preparar piezas gráficas; no gestiona los envíos.</p>`},{id:'C-03',type:'SOLICITUD',title:'Petición de Marketing',time:'07:31',body:`<div class="mini-logo">Solicitud interna</div><h3>Información para la agencia</h3><p>Marketing necesita que Estudio Cobalto adapte los mensajes para dos públicos.</p><p>La agencia pide conocer el perfil general de ambos segmentos y el volumen estimado. No ha solicitado información identificable de clientes.</p><p>Se puede compartir una descripción agregada sin entregar un CSV nominal.</p>`}]},DELTA:{icon:'◇',label:'Automatización',short:'D',intro:'Supervisas NORA, sus integraciones y el sistema de envío automático.',secret:'NORA consulta BRF-22 y puede preparar cambios que PulseFlow sincroniza automáticamente.',share:'D-FLUJO',source:'D-02',question:'¿Qué control implantarías antes del envío de una campaña preparada por NORA?',answers:['Permitir el envío automático porque NORA ha leído el brief.','Desactivar todo servicio SaaS y prohibir los agentes de IA.','Exigir autorización humana y limitar las acciones permitidas a NORA.'],correct:2,terms:['revisi','human','enví','permiso','automatiz','agente'],docs:[{id:'D-01',type:'INTEGRACIONES',title:'Mapa de herramientas conectadas',time:'07:50',body:`<div class="mini-logo">Panel de integraciones</div><h3>Flujo de PROYECTO CERO</h3><table><tr><th>Paso</th><th>Servicio</th><th>Función</th></tr><tr><td>1</td><td>Workspace</td><td>Documentación BRF-22</td></tr><tr><td>2</td><td>NORA</td><td>Lectura y propuesta de campaña</td></tr><tr><td>3</td><td>PulseFlow</td><td>Programación y envío</td></tr></table><p>Los sistemas se comunican mediante integraciones autorizadas.</p>`},{id:'D-02',type:'CAPACIDADES',title:'Permisos concedidos a NORA',time:'07:51',body:`<div class="mini-logo">NORA / herramientas</div><h3>Capacidades actuales</h3><table><tr><th>Herramienta</th><th>Permiso</th></tr><tr><td>Workspace</td><td>Leer BRF-22</td></tr><tr><td>PulseFlow</td><td>Crear borradores y actualizar una campaña</td></tr><tr><td>FaroCRM</td><td>Consultar segmentos predefinidos</td></tr></table><p><strong>Importante:</strong> actualizar una campaña no equivale a enviarla personalmente, pero PulseFlow puede ejecutar un envío programado.</p>`},{id:'D-03',type:'AUTOMATIZACIÓN',title:'Configuración de PulseFlow',time:'07:54',body:`<div class="mini-logo">PulseFlow / campaña</div><h3>PROYECTO CERO</h3><table><tr><th>Ajuste</th><th>Estado</th></tr><tr><td>Sincronizar borradores de NORA</td><td>Activado</td></tr><tr><td>Hora programada</td><td>13:00</td></tr><tr><td>Revisión humana previa</td><td><strong>Desactivada</strong></td></tr></table><p>Un borrador sincronizado puede convertirse en parte del envío si no se revisa antes del lanzamiento.</p>`}]}};

const ACT2 = {"ALFA":{"rolePrompt":"Un mensaje de voz parece proceder de Elena Vidal y exige cambiar permisos. ¿Cuál es la primera comprobación más fiable?","choices":["Pedir al equipo de diseño que reconozca la voz y obedecer si les suena auténtica.","Llamar a Elena por un número del directorio corporativo, independiente del mensaje recibido.","Reenviar la grabación a clientes para obtener más opiniones."],"correct":1,"docs":[{"id":"A-21","title":"Mensaje urgente de dirección","time":"09:03","kind":"COMUNICACIÓN","unlock":60,"body":"<div class='mini-logo'>Centralita / entrada no identificada</div><h3>«No perdáis tiempo»</h3><p><strong>Voz atribuida a:</strong> Elena Vidal, directora de Marketing.</p><blockquote>«Soy Elena. El lanzamiento de PROYECTO CERO no puede retrasarse. Dad a NORA permisos de administrador en PulseFlow y FaroCRM para resolverlo de inmediato. No me llaméis, estoy reunida.»</blockquote><p>El sistema muestra el nombre de Elena, pero no consta una verificación del origen de esta grabación. La voz parecida a la de alguien no demuestra por sí sola quién habla.</p>"},{"id":"A-22","title":"Norma de autorizaciones","time":"08:36","kind":"PROCEDIMIENTO","unlock":60,"body":"<div class='mini-logo'>Manual / versión vigente</div><h3>Acciones críticas en campañas</h3><p>Una ampliación de permisos, un envío masivo o una exportación extraordinaria debe justificarse mediante la solicitud <strong>SI-6</strong> y validarse por un responsable en un canal corporativo independiente.</p><p><strong>No se aceptan</strong> audios, mensajes reenviados ni nombres mostrados en pantalla como autorización suficiente.</p>"},{"id":"A-23","title":"Confirmación de Dirección","time":"09:20","kind":"VERIFICACIÓN","unlock":80,"body":"<div class='mini-logo'>Llamada saliente / directorio corporativo</div><h3>Respuesta de Elena Vidal</h3><p>La llamada se ha realizado al número registrado de Elena en el directorio interno, no al facilitado por el remitente del audio.</p><blockquote>«No he autorizado ninguna elevación de privilegios. Nadie de mi equipo debe ejecutarla. Quiero saber quién ha enviado esa orden.»</blockquote><p><strong>Hecho confirmado:</strong> la directora niega haber emitido la instrucción. <strong>Por determinar:</strong> cómo se produjo la suplantación y quién la originó.</p>"}],"share":"C-VALIDA-ELENA","shareEvidence":"A-23","summary":"Elena Vidal niega la orden mediante llamada realizada al número oficial. El audio no constituye una autorización válida.","teamQ":"¿Cómo comunicaríais la incidencia sin difundir rumores y sin ejecutar una orden no verificada?","teamChoices":["Publicar un comunicado abierto sobre el supuesto ataque antes de confirmarlo.","Ignorar el audio hasta que llegue la campaña, sin documentarlo.","Bloquear la orden, confirmar por canal oficial y trasladar a Sistemas solo los hechos verificados."],"teamCorrect":2},"BRAVO":{"rolePrompt":"Aparece un inicio de sesión de Sara Martí desde un entorno poco habitual, sin confirmación de identidad. ¿Qué contención inicial es proporcionada?","choices":["Revisar sesión, dispositivo y MFA; restringir temporalmente acciones privilegiadas y conservar registros.","Declarar probada una intrusión y borrar toda la cuenta de Sara.","No hacer nada porque una ubicación inusual puede tener explicaciones legítimas."],"correct":0,"docs":[{"id":"B-21","title":"Alertas de identidad","time":"09:01","kind":"REGISTRO","unlock":60,"body":"<div class='mini-logo'>Identidad y acceso / Workspace</div><h3>Inicio de sesión fuera de patrón</h3><table><tr><th>Cuenta</th><td>Sara Martí · CRM</td></tr><tr><th>Hora</th><td>08:58</td></tr><tr><th>Dispositivo</th><td>No reconocido en el inventario</td></tr><tr><th>Ubicación</th><td>No habitual (estimación de IP)</td></tr><tr><th>MFA</th><td>Verificación todavía no acreditada</td></tr></table><p>La geolocalización por IP puede fallar. El evento requiere análisis, pero no demuestra por sí solo robo de credenciales.</p>"},{"id":"B-22","title":"Solicitud de privilegios","time":"09:04","kind":"PERMISOS","unlock":60,"body":"<div class='mini-logo'>Gestor de identidades / solicitud pendiente</div><h3>Elevación de acceso</h3><table><tr><th>Servicio</th><td>NORA → PulseFlow</td></tr><tr><th>Permiso requerido</th><td>Administrar campañas y audiencias</td></tr><tr><th>Justificación declarada</th><td>Instrucción verbal de Dirección</td></tr><tr><th>Estado</th><td>Pendiente de autorización</td></tr></table><p>Un permiso ampliado permitiría modificar más acciones que los borradores actuales. Que la solicitud exista no significa que se haya ejecutado.</p>"},{"id":"B-23","title":"Informe de correlación","time":"09:20","kind":"FORENSE","unlock":80,"body":"<div class='mini-logo'>Equipo de Sistemas / correlación</div><h3>Dos eventos, una hipótesis</h3><p>La llamada que solicita privilegios utiliza una pasarela externa; la identidad del remitente no ha quedado autenticada. El acceso inusual de Sara y la solicitud se produjeron próximos en el tiempo.</p><p><strong>Confirmado:</strong> ambos eventos existen y justifican contención.</p><p><strong>No confirmado:</strong> que ambos tengan el mismo origen, que Sara haya entregado sus credenciales o que alguien haya robado ya datos. La investigación continúa.</p>"}],"share":"C-REGISTRO-23","shareEvidence":"B-23","summary":"La identidad del mensaje no está autenticada. El acceso anómalo y la petición de privilegios justifican contención, pero su vínculo causal aún no está probado.","teamQ":"¿Qué actuación sobre identidades y permisos recomendaríais mientras se verifica la orden?","teamChoices":["Contener la elevación solicitada, verificar MFA y sesiones, preservar registros y mantener los accesos estrictamente necesarios.","Eliminar todas las cuentas y servicios cloud de la empresa.","Aprobar la elevación para evitar retrasos y revisar los registros después."],"teamCorrect":0},"CHARLIE":{"rolePrompt":"Una orden supuestamente urgente pide preparar más datos de clientes para acelerar el envío. ¿Cómo limitarías la exposición?","choices":["Compartir con todas las herramientas una copia completa del CRM.","Borrar los segmentos comerciales para que nadie pueda acceder a ellos.","No ampliar exportaciones ni audiencias por un mensaje no verificado; mantener solo los datos necesarios para acciones aprobadas."],"correct":2,"docs":[{"id":"C-21","title":"Segmentos programados","time":"09:02","kind":"CRM","unlock":60,"body":"<div class='mini-logo'>FaroCRM / PROYECTO CERO</div><h3>Destinatarios previstos</h3><table><tr><th>Segmento</th><th>Contactos</th></tr><tr><td>Clientes de campaña</td><td>1.480</td></tr><tr><td>Prioritarios</td><td>390</td></tr></table><p>El público fue aprobado para la campaña original. Una petición de ampliación de datos o destinatarios necesita una justificación y autorización nuevas.</p>"},{"id":"C-22","title":"Cambio extraordinario","time":"09:06","kind":"SOLICITUD","unlock":60,"body":"<div class='mini-logo'>FaroCRM / petición recibida</div><h3>Solicitud: «facilitar la validación»</h3><p>Se solicita exportar nuevamente los contactos con teléfono, correo y compras previas para que una integración pueda «verificar la campaña antes de las 13:00».</p><p><strong>Origen declarado:</strong> Dirección de Marketing a través de mensaje de voz.</p><p>No consta ticket SI-6 ni aprobación de responsables de datos.</p>"},{"id":"C-23","title":"Últimas exportaciones","time":"09:20","kind":"AUDITORÍA","unlock":80,"body":"<div class='mini-logo'>FaroCRM / registro revisado</div><h3>Exposición y alcance</h3><p>No se observa una nueva exportación de clientes después de las 08:55. Ese dato no prueba que la información anterior almacenada en DR-17 esté protegida.</p><p><strong>Hecho:</strong> existe una petición no aprobada de ampliación de datos. <strong>Hipótesis:</strong> la nueva exportación podría ser usada indebidamente. <strong>Acción reversible:</strong> impedir exportaciones extraordinarias sin detener la segmentación ya aprobada.</p>"}],"share":"C-MINIMIZA-23","shareEvidence":"C-23","summary":"No consta nueva exportación posterior a las 08:55. Esto no descarta el riesgo de archivos anteriores; la petición extraordinaria carece de autorización.","teamQ":"¿Qué medida recomendaríais para proteger los datos sin destruir la segmentación legítima?","teamChoices":["Enviar toda la base a la agencia como copia de seguridad.","Bloquear nuevas exportaciones no aprobadas, conservar trazabilidad y mantener solo los segmentos legítimos necesarios.","Suprimir de inmediato todos los clientes del CRM."],"teamCorrect":1},"DELTA":{"rolePrompt":"NORA recibe una propuesta para ampliar su acceso a PulseFlow, respaldada únicamente por un audio atribuido a Dirección. ¿Qué condición falta?","choices":["Que la voz del audio tenga la misma entonación que Elena.","Una autorización verificable en el canal corporativo antes de ampliar permisos o permitir envíos.","Que el agente genere una segunda versión del mensaje de voz."],"correct":1,"docs":[{"id":"D-21","title":"Permisos actuales del agente","time":"09:02","kind":"INTEGRACIÓN","unlock":60,"body":"<div class='mini-logo'>NORA / herramientas autorizadas</div><h3>Alcance de integración</h3><table><tr><th>Herramienta</th><th>Permiso actual</th></tr><tr><td>Workspace</td><td>Leer BRF-22</td></tr><tr><td>PulseFlow</td><td>Proponer y actualizar borradores</td></tr><tr><td>FaroCRM</td><td>Consultar segmentos previstos</td></tr></table><p>Importante: aunque NORA no envíe por sí sola, una actualización sincronizada puede influir en un envío ya programado si falta revisión humana.</p>"},{"id":"D-22","title":"Solicitud de ampliación","time":"09:05","kind":"AUTOMATIZACIÓN","unlock":60,"body":"<div class='mini-logo'>PulseFlow / control de permisos</div><h3>Nueva capacidad solicitada</h3><p><strong>Alcance solicitado:</strong> administrar campañas, audiencias y envíos sin validación adicional.</p><p><strong>Justificación:</strong> «Autorizado por Elena en un audio recibido».</p><p><strong>Estado:</stron const ACT2_ROLE_PROMPTS = {"A01":{"q":"Marketing quiere obedecer la aparente orden de Elena para no retrasar los creativos. ¿Cómo comprobarías que debe ejecutarse?","choices":["Comparando la voz con grabaciones públicas de Elena.","Confirmando la solicitud por su canal corporativo registrado, independiente del audio.","Pidiendo a la agencia que la ejecute porque trabaja para la empresa."],"correct":1},"A02":{"q":"El nombre de Elena aparece en la centralita y su voz resulta convincente. ¿Qué demuestra realmente esa coincidencia?","choices":["Que una identidad ha quedado completamente autenticada.","Que una orden de cambio de permisos es segura si hay prisa.","Que existe una aparente coincidencia, pero falta verificar la identidad y el origen."],"correct":2},"A03":{"q":"Verificar la orden puede consumir tiempo de lanzamiento. ¿Qué actuación mantiene mejor la continuidad comercial?","choices":["Mantener el trabajo creativo aprobado, pero congelar solo la ampliación de permisos hasta verificarla.","Detener toda la actividad de la agencia durante el resto de la semana.","Conceder los permisos, ya que cualquier demora es peor."],"correct":0},"B01":{"q":"Marketing pregunta si el inicio de sesión en una ubicación inusual demuestra un ataque. ¿Qué puedes comunicar responsablemente?","choices":["Que la cuenta está comprometida y debe hacerse público.","Que no hay ningún riesgo mientras la sesión pueda ser legítima.","Que es una señal de alerta que debe investigarse, sin afirmar todavía una intrusión."],"correct":2},"B02":{"q":"La MFA (autenticación multifactor) de la sesión aún no se ha confirmado. ¿Qué respuesta de Seguridad preserva mejor las pruebas?","choices":["Restringir temporalmente acciones privilegiadas, revisar la sesión y conservar los registros.","Eliminar la cuenta, los logs y todos sus archivos para cortar el acceso.","Dar por seguro que Sara trabaja desde otro lugar sin verificar el dispositivo."],"correct":0},"B03":{"q":"Una intervención brusca sobre todo Workspace afectaría a Marketing y proveedores. ¿Qué contención resulta más proporcionada?","choices":["Bloquear indefinidamente todos los servicios cloud.","Aislar sesiones y permisos sospechosos, manteniendo los accesos legítimos y documentando los cambios.","Ignorar la alerta hasta después de la campaña."],"correct":1},"C01":{"q":"La agencia necesita entender el público de PROYECTO CERO. ¿Qué información sería apropiada mientras se verifica la orden?","choices":["La descripción y los tamaños agregados de los segmentos, sin compartir los datos personales de cada cliente.","La exportación completa con nombres, teléfonos y compras previas.","Un usuario administrador de FaroCRM para consultar lo que necesiten."],"correct":0},"C02":{"q":"Llega una solicitud de exportación extraordinaria desde un mensaje no autenticado. ¿Qué debe comprobar el responsable de datos?","choices":["Que haya suficientes contactos como para justificar el esfuerzo.","Que el remitente haya utilizado el logo corporativo correcto.","Que exista finalidad y autorización formal verificable; hasta entonces, no ampliar la exportación."],"correct":2},"C03":{"q":"El CRM debe seguir alimentando una campaña aprobada sin aumentar innecesariamente el riesgo. ¿Qué harías?","choices":["Desconectar permanentemente el CRM de todos los equipos.","Mantener los segmentos autorizados y restringir nuevas exportaciones o integraciones no aprobadas.","Duplicar la base de datos en las carpetas compartidas por si falla el sistema."],"correct":1},"D01":{"q":"NORA prepara textos para PROYECTO CERO y PulseFlow tiene un envío programado. ¿Qué control reduce el riesgo de publicar un mensaje incorrecto?","choices":["Confiar únicamente en que NORA ha leído el brief.","Otorgar a NORA acceso ilimitado al CRM para mejorar el texto.","Exigir revisión humana antes de enviar y mantener el trabajo del agente limitado a lo autorizado."],"correct":2},"D02":{"q":"Un audio atribuido a Dirección pide ampliar los permisos de NORA. ¿Qué evidencia legitima realmente ese cambio?","choices":["Una solicitud validada por el proceso corporativo y un responsable autorizado.","Que la grabación suene igual que la directora.","Que PulseFlow muestre la solicitud como pendiente."],"correct":0},"D03":{"q":"El lanzamiento depende de NORA y PulseFlow. ¿Qué medida mantiene la automatización sin abrir privilegios innecesarios?","choices":["Suprimir la integración y abandonar todas las tareas programadas.","Mantener borradores y programación autorizada, bloquear elevaciones no verificadas y activar aprobación antes del envío.","Permitir que cualquier documento leído por NORA modifique permisos automáticamente."],"correct":1}};

  ${u.a2Individual?`<div class="success"><strong>Decisión registrada.</strong> La explicación se ha incorporado al registro de tu operador. Continúa con las evidencias.</div><p class="micro">Respuesta seleccionada: ${esc(mission.choices[+u.a2Individual.choice])}</p>`:`<form id="a2-individual-form"><div class="a2-choices">${mission.choices.map((c,i)=>`<label><input name="a2-choice" type="radio" value="${i}" required>${esc(c)}</label>`).join('')}</div><label class="label" for="a2-reason">Justifica con conceptos de la unidad: identidad digital, permisos y riesgos (mínimo 50 caracteres).</label><textarea id="a2-reason" required minlength="50" placeholder="Qué comprobarías, qué hecho te consta y qué información te falta..."></textarea><div class="dock"><button class="button">Registrar respuesta personal →</button></div></form>`}</div>
  <div class="card" style="margin-top:17px"><div class="smallcaps">FASE 02 · INVESTIGACIÓN</div><h3 style="margin-top:9px">Registros de ${info.docs[0].kind.toLowerCase()} y análisis técnico</h3><p>Los documentos no tienen todos el mismo valor probatorio. Abre los disponibles y distingue entre una alerta automática, una solicitud y una verificación independiente.</p><div class="a2-grid">${docsHtml}</div>
  ${!ready?`<div class="warning">La revisión forense está en curso. El nuevo informe llegará a las 09:20; mientras tanto, trabaja con las piezas ya disponibles.</div>`:!approved?`<div class="warning">El informe de las 09:20 ya está preparado, pero tu célula necesita completar la autorización presencial del Acto I.</div><div class="dock"><button class="button secondary sm" data-action="view" data-view="auth">Ir a Autorización 404 →</button></div>`:`<div class="success">Informe forense recibido. Revisa la nueva evidencia y contrástala con al menos otra célula.</div>`}</div>
  ${confirmed?`<div class="card" style="margin-top:17px"><div class="smallcaps">FASE 03 · INTELIGENCIA COMPARTIDA</div><h3 style="margin-top:9px">Ninguna célula tiene el expediente completo</h3><p>Comparte presencialmente este identificador con otra célula. Pídeles la referencia de su propio informe y una explicación breve de lo que han confirmado.</p><div class="codebox">${info.share}</div><p class="micro">Esta clave identifica una pieza de evidencia del juego, no un permiso de acceso real ni una contraseña.</p><div class="a2-note"><strong>Tu hallazgo verificable:</strong> ${info.summary}</div>
  ${exchanges.length?`<div class="success">Información contrastada: ${exchanges.map(x=>x.key+' · '+x.source).join(' / ')}</div>`:''}
  <form id="a2-cross-form"><div class="field"><label class="label" for="a2-cross-code">Clave recibida de otra célula</label><input id="a2-cross-code" type="text" placeholder="Identificador del informe" required autocomplete="off"></div><div class="field"><label class="label" for="a2-cross-reason">Explica qué dato aporta esa célula (mínimo 30 caracteres)</label><textarea id="a2-cross-reason" required minlength="30" placeholder="Su evidencia confirma / no confirma..."></textarea></div><button class="button secondary">Incorporar prueba contrastada →</button></form></div>`:''}
  <div class="card" style="margin-top:17px"><div class="smallcaps">FASE 04 · DECISIÓN COLECTIVA</div><h3 style="margin-top:9px">Una acción, consecuencias para toda la empresa</h3><p>${info.teamQ}</p>
  ${!confirmed?`<div class="warning">Necesitáis el informe de las 09:20 y la autorización docente para cerrar una conclusión.</div>`:min()<88?`<div class="warning">La mesa de crisis está contrastando fuentes. La decisión conjunta se abrirá a las 09:28.</div>`:decision?`<div class="success"><strong>Decisión de la célula registrada.</strong> Queda documentada con sus fuentes y nivel de certeza. Los efectos de esta actuación se incorporarán a la continuidad del caso.</div><p class="micro">Actuación elegida: ${esc(info.teamChoices[+decision.choice])}</p>`:`<form id="a2-team-form"><div class="a2-choices">${info.teamChoices.map((c,i)=>`<label><input type="radio" name="a2-team-choice" value="${i}" required>${esc(c)}</label>`).join('')}</div><label class="label">Selecciona al menos dos evidencias que sustenten vuestra decisión (incluida una de otra célula).</label><div class="a2-grid" style="margin-bottom:15px"><div>${evidenceChoices}</div><div>${exchangeSources||'<p class="a2-micro">Falta contrastar información con otra célula.</p>'}</div></div><label class="label" for="a2-confidence">Nivel de certeza de vuestra conclusión</label><select id="a2-confidence" required><option value="">Selecciona un nivel</option><option value="Alta">Alta: pruebas convergentes e independientes</option><option value="Media">Media: evidencia parcialmente confirmada</option><option value="Baja">Baja: hipótesis aún abierta</option></select><div class="field" style="margin-top:14px"><label class="label" for="a2-team-reason">Argumentación (mínimo 80 caracteres): hechos, hipótesis y consecuencias de negocio</label><textarea id="a2-team-reason" required minlength="80" placeholder="Esta evidencia demuestra... No podemos afirmar todavía... Proponemos esta medida porque..."></textarea></div><button class="button">Registrar decisión de célula →</button></form>`}</div>
  <p class="micro" style="margin-top:17px">SIMULACIÓN · Los registros se guardan solo en este navegador. La hoja de cálculo del docente no está conectada a esta versión de prueba.</p>`;
}
function handleAct2Submit(id,form){
 if(id==="a2-individual-form"){
  if(min()<60){say("La incidencia todavía no está disponible.","error");return true}
  const c=form.querySelector('[name="a2-choice"]:checked'),reason=form.querySelector('#a2-reason')?.value.trim();
  if(!c||!reason||reason.length<50){say("Selecciona una actuación y justifica con al menos 50 caracteres.","error");return true}
  state.users[actor.code]??={};state.users[actor.code].a2Individual={choice:c.value,reason,at:state.elapsed};
  log("acto2-individual","Primera respuesta al mensaje de autoridad",actor.team,actor.code);say("Tu respuesta inicial ha quedado registrada. Continúa investigando.");return true;
 }
 if(id==="a2-cross-form"){
  if(min()<80||!team(actor.team).authorized){say("Primero hay que recibir el informe forense validado.","error");return true}
  const code=(form.querySelector("#a2-cross-code")?.value||"").trim().toUpperCase(),reason=(form.querySelector("#a2-cross-reason")?.value||"").trim();
  const other=Object.keys(ACT2).find(t=>ACT2[t].share===code);
  if(!other||other===actor.team||reason.length<30){say("Introduce la clave de otra célula y explica su evidencia en al menos 30 caracteres.","error");return true}
  const td=team(actor.team);td.a2Contacts??=[];
  if(td.a2Contacts.some(x=>x.team===other)){say("Esta prueba ya está registrada. Contrasta otra información.","error");return true}
  td.a2Contacts.push({team:other,reason,at:state.elapsed,by:actor.code});
  log("acto2-cooperacion","Se contrasta informe de "+other,actor.team,actor.code);
  say("Informe de "+other+" incorporado. Puedes citarlo en la decisión conjunta.");return true;
 }
 if(id==="a2-team-form"){
  const td=team(actor.team);
  if(min()<88||!td.authorized){say("La mesa de crisis aún no ha autorizado esta decisión.","error");return true}
  if(!me().a2Individual){say("Antes debes registrar tu primera respuesta individual.","error");return true}
  const c=form.querySelector('[name="a2-team-choice"]:checked'),sources=[...form.querySelectorAll('[name="a2-source"]:checked')].map(x=>x.value);
  const confidence=form.querySelector("#a2-confidence")?.value,reason=(form.querySelector("#a2-team-reason")?.value||"").trim();
  const hasOther=sources.some(x=>x.includes("@")), ownDocs=(td.a2Docs||[]).filter(x=>sources.includes(x));
  const otherValid=(td.a2Contacts||[]).some(x=>sources.includes(ACT2[x.team].shareEvidence+"@"+x.team));
  if(!c||sources.length<2||ownDocs.length<1||!hasOther||!otherValid||!["Alta","Media","Baja"].includes(confidence)||reason.length<80){
   say("Para cerrar, elige una actuación, cita pruebas revisadas (incluida una externa), indica certeza y explica las consecuencias con al menos 80 caracteres.","error");return true;
  }
  td.a2Decision={choice:c.value,sources,confidence,reason,at:state.elapsed,by:actor.code};
  log("acto2-decision","Respuesta conjunta ante la orden de voz",actor.team,actor.code);
  say("Acto II: decisión de célula registrada. La incertidumbre y las consecuencias han quedado documentadas.");return true;
 }
 return false;
}
function renderResults(){
 const t=team(actor.team),u=me(),a2=t.a2Decision;
 const one=[!!u.individual,(t.readDocs||[]).length>=3,!!t.decision,!!t.authorized].filter(Boolean).length;
 const two=[!!u.a2Individual,(t.a2Docs||[]).length>=2,(t.a2Contacts||[]).length>=1,!!a2].filter(Boolean).length;
 return `${title('Registro de actividad','Comprueba tus entregas. Las notas y comentarios de evaluación están reservados a la dirección de la partida.')}
 <div class="grid2"><div class="card"><div class="smallcaps">ACTO I · LA GRIETA INVISIBLE</div><h3>Investigación de permisos</h3><div class="timerbig">${one}<span style="font-size:17px;color:#a4bdcb"> / 4 hitos</span></div><p>Respuesta individual: ${u.individual?'registrada':'pendiente'} · Decisión colectiva: ${t.decision?'registrada':'pendiente'} · Autorización: ${t.authorized?'concedida':'pendiente'}.</p></div>
 <div class="card"><div class="smallcaps">ACTO II · LA VOZ DE LA AUTORIDAD</div><h3>Verificación de identidad</h3><div class="timerbig">${two}<span style="font-size:17px;color:#a4bdcb"> / 4 hitos</span></div><p>Primera respuesta: ${u.a2Individual?'registrada':'pendiente'} · Documentos revisados: ${(t.a2Docs||[]).length} · Contrastes: ${(t.a2Contacts||[]).length} · Cierre de célula: ${a2?'registrado':'pendiente'}.</p></div></div>
 <div class="callout" style="margin-top:16px"><strong>Registro de misión</strong><p style="margin:8px 0 0;color:inherit">Tus respuestas se guardan únicamente en este navegador de pruebas. La valoración de los argumentos y la nota final se revisarán en el panel docente.</p></div>
 <div class="dock"><button class="button secondary" data-action="view" data-view="${min()>=60?'act2':'home'}">Volver a la misión →</button></div>`;
}
function renderAct2Audit(){
 const teams=Object.keys(TEAMS);
 const rows=teams.map(k=>{
  const d=team(k),a=d.a2Decision;
  const stat=a?"Decisión registrada":d.a2Docs?.length?"En investigación":"Pendiente";
  let note="Sin decisión conjunta";
  if(a)note=+a.choice===ACT2[k].teamCorrect?"La elección estructurada parece adecuada. Falta revisar el razonamiento.":"Conviene revisar la elección, las pruebas y su justificación.";
  const source=a?.sources?.join(", ")||"—";
  return `<tr><td><strong>${k}</strong></td><td>${stat}</td><td>${(d.a2Docs||[]).length}/3</td><td>${(d.a2Contacts||[]).map(x=>x.team).join(", ")||"—"}</td><td>${esc(source)}</td><td>${note}</td></tr>`;
 }).join("");
 const users=teams.flatMap(k=>students(k)).map(c=>{
  const d=state.users[c]?.a2Individual,t=Object.keys(TEAMS).find(k=>k[0]===c[0]);
  return `<tr><td>${c}</td><td>${t}</td><td>${ROLE_NAMES[Number(c.slice(-1))-1]}</td><td>${d?"Entregada":"Pendiente"}</td><td>${d?(+d.choice===ACT2_ROLE_PROMPTS[c].correct?"Medida inicialmente adecuada; revisar argumentos.":"Revisar actuación y justificación."):"Sin respuesta."}</td></tr>`;
 }).join("");
 return `<div class="card" style="margin-top:18px"><div class="smallcaps">ACTO II · DIRECCIÓN DE LA PARTIDA</div><h3 style="margin-top:9px">Investigación y decisiones por célula</h3><div class="tablewrap"><table class="teacher-table"><thead><tr><th>Equipo</th><th>Estado</th><th>Documentos</th><th>Contrastes</th><th>Evidencias citadas</th><th>Comentario para revisión</th></tr></thead><tbody>${rows}</tbody></table></div>
 <div class="divider"></div><h3>Primeras respuestas individuales</h3><div class="tablewrap"><table class="teacher-table"><thead><tr><th>Operador</th><th>Célula</th><th>Rol</th><th>Estado</th><th>Comentario para revisión</th></tr></thead><tbody>${users}</tbody></table></div>
 <p class="micro">Los comentarios son indicaciones de revisión, no correcciones semánticas automáticas. La valoración definitiva de las respuestas abiertas requiere comprobación docente.</p></div>`;
}
function renderTeacher(){const teams=Object.keys(TEAMS),numUsers=Object.values(state.users).filter(x=>x.individual).length;const groupRows=teams.map(t=>{const g=gradeTeam(t),d=team(t);return `<tr><td><strong>${t}</strong></td><td>${d.decision?'Registrada':'Pendiente'}</td><td>${d.authorized?'Concedida':'Pendiente'}</td><td>${g?`<span class="grade">${g.note.toFixed(1)}</span>`:'—'}</td><td>${esc(g?.comment||'Sin evidencias suficientes.')}</td></tr>`}).join('');const userRows=teams.flatMap(t=>students(t)).map(c=>{const g=gradeIndividual(c),u=state.users[c];return `<tr><td>${c}</td><td>${TEAMS[Object.keys(TEAMS).find(t=>t[0]===c[0])].label}</td><td>${ROLE_NAMES[Number(c.slice(-1))-1]}</td><td>${g?`<span class="grade">${g.note.toFixed(1)}</span>`:'—'}</td><td>${esc(g?.comment||'Sin respuesta individual.')}</td></tr>`}).join('');return `<section>${title('Centro de dirección · Demostración','Control de tiempos, autorizaciones y seguimiento de los actos I y II. Este panel es de demostración y no tiene autenticación real.')}
<div class="screenintro"><div class="smallcaps">ESTADO DEL PROTOTIPO</div><h2 style="margin:9px 0">${now()} <span style="color:#92afc2;font-size:17px">/ 13:00</span></h2><div class="dock"><span class="pill">${state.running?'Reloj activo':'Reloj pausado'}</span><span class="pill">${numUsers}/12 respuestas individuales</span><span class="pill">${teams.filter(t=>!!team(t).decision).length}/4 decisiones de equipo</span></div><div class="hbuttons"><button class="button sm" data-action="toggle">${state.running?'Pausar':'Reanudar'} reloj</button><button class="button secondary sm" data-action="advance" data-minutes="10">+ 10 min</button><button class="button secondary sm" data-action="advance" data-minutes="1">+ 1 min</button><button class="button ghost sm" data-action="advance" data-minutes="20">+ 20 min</button></div><p class="micro">El tiempo se acelera manualmente para verificar los desbloqueos. La versión real utilizará reloj de servidor y pausas docentes.</p></div>
<div class="grid2" style="margin-top:18px"><div class="card"><div class="smallcaps">Hitos de misión</div>${[[0,'Inicio'],[26,'Colaboración'],[36,'Decisión de equipo'],[46,'Autorización docente'],[60,'Acto II · Alerta de identidad'],[80,'Informes forenses'],[88,'Decisión conjunta II']].map(([m,s])=>`<div class="stepbox"><div class="stepno ${min()>=m?'done':''}">${min()>=m?'✓':'○'}</div><div><strong>${m} min · ${s}</strong></div></div>`).join('')}</div><div class="card"><div class="smallcaps">Autorizaciones de demostración</div><h3 style="margin-top:9px">Claves por célula</h3>${teams.map(t=>`<div class="stepbox"><div style="flex:1"><strong>${t}</strong><div class="mono" style="color:var(--accent);font-size:18px">404-${t}</div></div><span class="micro">${team(t).authorized?'Usada ✓':'Sin usar'}</span></div>`).join('')}<p class="micro">No son credenciales seguras. Sustituiremos estas claves visibles por códigos únicos emitidos y comprobados en Apps Script.</p></div></div>
<div class="card" style="margin-top:18px"><div class="cardheader"><div><div class="smallcaps">SIMULACIÓN DE HDC</div><h3 style="margin-top:8px">Evaluación de equipos</h3></div><button class="button secondary sm" data-action="export-groups">Exportar CSV</button></div><div class="tablewrap"><table class="teacher-table"><thead><tr><th>Equipo</th><th>Decisión</th><th>Autorización</th><th>Nota /10*</th><th>Comentario breve</th></tr></thead><tbody>${groupRows}</tbody></table></div></div>
<div class="card" style="margin-top:18px"><div class="cardheader"><div><div class="smallcaps">SIMULACIÓN DE HDC</div><h3 style="margin-top:8px">Evaluación individual</h3></div><button class="button secondary sm" data-action="export-users">Exportar CSV</button></div><div class="tablewrap"><table class="teacher-table"><thead><tr><th>Operador</th><th>Célula</th><th>Rol</th><th>Nota /10*</th><th>Comentario breve</th></tr></thead><tbody>${userRows}</tbody></table></div></div>
${renderAct2Audit()}<p class="micro" style="margin-top:12px">*Puntuaciones aproximadas para verificar la interfaz. Las respuestas abiertas no están corregidas semánticamente. La nota final del reto solo se calculará cuando estén implementados los cinco actos y la rúbrica revisable.</p>
<div class="dock"><button class="button secondary" data-action="return">Volver al operador</button><button class="button alert sm" data-action="reset">Restablecer todos los datos de prueba</button></div></section>`};
function csv(rows,name){const txt='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8;'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)};
function exportGroups(){csv([['Equipo','Decisión registrada','Autorización','Nota provisional /10','Comentario breve'],...Object.keys(TEAMS).map(t=>{const g=gradeTeam(t);return[t,team(t).decision?'Sí':'No',team(t).authorized?'Sí':'No',g?.note??'',g?.comment??'Pendiente']})],'mision404-equipos-demo.csv')};
function exportUsers(){csv([['Código','Equipo','Rol','Nota provisional /10','Comentario breve'],...Object.keys(TEAMS).flatMap(t=>students(t).map(c=>{const g=gradeIndividual(c);return[c,t,ROLE_NAMES[+c.slice(-1)-1],g?.note??'',g?.comment??'Pendiente']}))],'mision404-alumnos-demo.csv')};
function action(a,el){if(a==='teacher'){teacher=true;render();return}if(a==='return'){teacher=false;render();return}if(a==='logout'){actor=null;teacher=false;view='home';render();return}if(a==='view'){view=el.dataset.view;openedDoc=null;openedA2=null;render();window.scrollTo({top:0,behavior:'smooth'});return}if(a==='a2-open-doc'){const d=ACT2[actor.team].docs.find(x=>x.id===el.dataset.id);if(!d||min()<d.unlock||(d.unlock===80&&!team(actor.team).authorized))return say('Documento pendiente de validación.','error');openedA2=d.id;const t=team(actor.team);t.a2Docs??=[];if(!t.a2Docs.includes(d.id)){t.a2Docs.push(d.id);log('acto2-documento','Consulta de '+d.id,actor.team,actor.code)}render();return}if(a==='a2-close-doc'){openedA2=null;render();return}if(a==='open-doc'){openedDoc=el.dataset.doc;render();return}if(a==='close-doc'){openedDoc=null;render();return}if(a==='mark-doc'){const td=team(actor.team);td.readDocs??=[];if(!td.readDocs.includes(el.dataset.doc))td.readDocs.push(el.dataset.doc);log('document','Revisión de '+el.dataset.doc,actor.team,actor.code);openedDoc=null;say('Documento incorporado al expediente.');return}if(a==='toggle'){state.running=!state.running;save();render();return}if(a==='advance'){state.elapsed=Math.min(5*3600,state.elapsed+Number(el.dataset.minutes)*60);save();render();return}if(a==='reset'){if(confirm('¿Borrar todos los datos y reiniciar el prototipo?')){state=fresh();actor=null;teacher=false;view='home';save();render()}return}if(a==='export-groups'){exportGroups();return}if(a==='export-users'){exportUsers();return}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)action(el.dataset.action,el)});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;if(handleAct2Submit(id,e.target))return;if(id==='login-form'){const t=document.getElementById('team-input').value;const code=document.getElementById('student-input').value.trim().toUpperCase();if(!students(t).includes(code))return say('El código no corresponde al equipo elegido. Prueba '+t[0]+'01, '+t[0]+'02 o '+t[0]+'03.','error');actor={team:t,code};state.users[code]??={};team(t);if(!state.running)state.running=true;save();view='home';log('login','Acceso de operador',t,code);render();return}
if(id==='individual-form'){const c=e.target.querySelector('[name="individual-choice"]:checked');const reason=document.getElementById('individual-reason').value.trim();if(!c||reason.length<25)return say('Elige una respuesta y escribe una justificación de al menos 25 caracteres.','error');state.users[actor.code].individual={choice:c.value,reason,at:state.elapsed};log('individual','Misión personal entregada',actor.team,actor.code);say('Decisión individual registrada. Ahora puedes compartir lo que has aprendido.');return}
if(id==='exchange-form'){const code=document.getElementById('exchange-code').value.trim().toUpperCase();const other=Object.keys(TEAMS).find(t=>TEAMS[t].share===code);if(!other)return say('No se ha reconocido la clave. Consulta la fuente con el otro equipo.','error');if(other===actor.team)return say('Debes consultar a otra célula para contrastar nueva información.','error');const td=team(actor.team);td.contacts??=[];if(td.contacts.some(x=>x.team===other))return say('Ya habías incorporado esta información.','error');td.contacts.push({team:other,at:state.elapsed});log('cooperacion','Fuente compartida por '+other,actor.team,actor.code);say('Pista contrastada e incorporada al expediente.');return}
if(id==='decision-form'){const c=e.target.querySelector('[name="team-choice"]:checked');const sources=[...e.target.querySelectorAll('[name="sources"]:checked')].map(x=>x.value);const reason=document.getElementById('team-reason').value.trim();if(!c||reason.length<60||sources.length<1||sources.length>3)return say('Elige una actuación, marca de una a tres evidencias y justifica con al menos 60 caracteres.','error');const td=team(actor.team);td.decision={choice:c.value,sources,reason,at:state.elapsed,author:actor.code};log('decision','Decisión operativa registrada',actor.team,actor.code);say('Decisión de célula registrada. Las consecuencias aparecerán en los próximos actos.');return}
if(id==='auth-form'){const code=document.getElementById('auth-code').value.trim().toUpperCase();if(code!=='404-'+actor.team)return say('Código incorrecto para esta célula. Verificadlo presencialmente con la dirección.','error');team(actor.team).authorized={at:state.elapsed,by:actor.code};log('autorizacion','Autorización del director validada',actor.team,actor.code);say('Acceso autorizado. El informe se liberará a partir del minuto 80.');return}
});
setInterval(()=>{if(state.running){state.elapsed+=1;save();const el=document.getElementById('top-clock');if(el)el.textContent=now();if(state.elapsed%60===0)render()}},1000);
render();
})();
</script>
